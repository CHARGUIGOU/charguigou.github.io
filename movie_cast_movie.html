<style>
@import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&display=swap');

#app {
    font-family: 'Open Sans', Palatino, serif;
    background: #fff;
    color: #111;
    padding: 20px;
}

/* --- FILMS --- */
.film-controls {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 20px;
}

.film-controls input, .film-controls select {
    padding: 8px 12px;
    font-size: 16px;
    border-radius: 6px;
    border: 1px solid #ccc;
    text-align: center;
}

.film-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, 160px);
    justify-content: center;
    gap: 20px;
    max-width: 1600px;
    margin: 0 auto;
}

.film-grid:hover .film-card:not(:hover) {
    transform: scale(0.94);
    opacity: 0.6;
}

.film-card {
    position: relative;
    isolation: isolate;
    cursor: pointer;
    border-radius: 14px;
    overflow: hidden;
    background: transparent;
    aspect-ratio: 3 / 4;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.4s ease, opacity 0.4s ease;
    transform: translateZ(0);
    will-change: transform;
}

.film-card:hover {
    transform: translateY(-8px) scale(1.06);
    box-shadow: 0 6px 14px rgba(0,0,0,0.4);
    z-index: 10;
}

/* Hover uniquement sur l'image */
.film-card img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scale(1);
    transition: transform 0.6s ease, filter 0.6s ease;
    will-change: transform;
    backface-visibility: hidden;
}

.film-card:hover img {
    transform: scale(1.12);
    filter: brightness(0.65);
}

/* --- Overlay texte glissant --- */
.film-card-title-overlay {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(
       to top,
       rgba(0,0,0,0.85) 0%,
       rgba(0,0,0,0.5) 40%,
       rgba(0,0,0,0.2) 70%,
       rgba(0,0,0,0.05) 100%);
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    padding: 20px 12px;
    box-sizing: border-box;
    opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: none;
    will-change: opacity;
    transform: translateZ(0);
}

.film-card:hover .film-card-title-overlay {
    opacity: 1;
    transform: translateZ(0);
    backface-visibility: hidden;
    will-change: transform;
}

.film-card-title-text,
.film-card-year {
    display: block;
    margin: 0 auto;
}

.film-card-title-text {
    font-family: 'Palatino Linotype', 'Palatino', serif;
    font-style: italic;
    font-size: 18px;
    color: #fff;
    text-align: center;
    margin-bottom: 6px;
    text-shadow:
         0 2px 10px rgba(0,0,0,0.9),
         0 0 6px rgba(0,0,0,0.8);
}

.film-card-year {
    font-family: 'Open Sans', serif;
    font-size: 12px;
    letter-spacing: 2px;
    color: #fff;
    text-shadow: 0 0 6px rgba(0,0,0,0.8);
}

.film-card::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at var(--x,50%) var(--y,30%),
      rgba(255,255,255,0.8) 0%,
      rgba(255,255,255,0.35) 20%,
      rgba(255,255,255,0.12) 40%,
      transparent 70%);
    opacity: 0;
    transition: opacity 0.25s ease;
    pointer-events: none;
    mix-blend-mode: screen;
}

.film-card:hover::after {
    opacity: 1;
}

/* --- MODAL LANGUES --- */
#modalLangues {
    position: fixed;
    top:0; left:0;
    width:100%;
    height: 100vh;
    background: rgba(0,0,0,0.8);
    display: none;
    justify-content: center;
    align-items: flex-start;
    overflow: hidden;
    padding: 40px 20px;
    z-index: 999;
    box-sizing: border-box;
}

.modal-content {
    background: #fff;
    border-radius: 10px;
    max-width: 1200px;
    width: 100%;
    padding: 20px;
    position: relative;
    max-height: calc(100vh - 120px);
    overflow-y: auto;
}

.close-modal {
    position: absolute;
    top:10px; right:10px;
    font-size: 22px;
    font-weight: bold;
    cursor: pointer;
}

/* --- Barre recherche et tri langues --- */
.lang-controls {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 40px;
}

.lang-controls input, .lang-controls select {
    padding: 6px 10px;
    font-size: 14px;
    border-radius: 5px;
    border: 1px solid #ccc;
}

/* --- Grille langues --- */
.lang-grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
    margin-bottom: 60px;
}

.lang-card {
    text-align: center;
    width: 100px;
    transition: 0.3s;
    border-radius: 8px;
    transform: translateZ(0);
}

.lang-card img.flag {
    width: 100px;
    height: 60px;
    object-fit: contain;
}

.lang-card h3 {
    margin: 5px 0 0 0;
    font-size: 14px;
    line-height: 1;
}

.lang-card p {
    margin: 0;
    font-size: 12px;
    color: #555;
    line-height: 1;
}

.lang-card.clickable {
    cursor: pointer;
    will-change: transform;
}

.lang-card:not(.clickable) {
    opacity: 0.5;
}

.lang-card.nodubbing {
    filter: grayscale(1);
    opacity: 0.4;
    cursor: default;
}

#noDubbingSection {
    margin-bottom: 80px;
}

.nodubbing-grid {
    margin-bottom: 80px;
}

.lang-card.clickable:hover {
    transform: translateY(-4px);
    filter: saturate(1.0) brightness(1.0) drop-shadow(0px 6px 8px rgba(0,0,0,0.3));
}

/* --- Galerie personnages --- */
.gallery {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0 10px;
    margin-bottom: 50px;
}

.character {
    text-align: center;
    width: 100px;
}

.character img {
    display: block;
    width: 100px;
    height: 100px;
    object-fit: cover;
    border-radius: 10px;
    transition: transform 0.3s;
    cursor: pointer;
}

.character p {
    text-align: center;
    margin: 1px 0 0 0;
    font-size: 13px;
}

.character img:hover {
    transform: scale(1.1);
    will-change: transform;
}

/* --- Trivia --- */
.trivia {
    padding: 0 20px;
}

.trivia h2::before {
    content: "• ";
}

.trivia h2 {
    font-weight: 700;
    display: inline;
}

.trivia p {
    margin: 5px 0 0 0;
}

/* --- Lightbox Personnages --- */
#lightbox {
    position: fixed;
    top:0; left:0;
    width:100%; height:100%;
    background: rgba(0,0,0,0.9);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 1000;
}

.lightbox-content {
    position: relative;
    max-width: 80%;
    text-align: center;
}

.lightbox-content img {
    width: 100%;
    max-height: 80vh;
}

.lightbox-content h3 {
    margin: 10px 0;
    color:white;
}

.lightbox-close {
    position: absolute;
    top: 5px;
    right: 10px;
    font-size: 22px;
    font-weight: bold;
    color: #fff;
    cursor: pointer;
}

.lightbox-arrow {
    position: absolute;
    top:50%;
    transform: translateY(-50%);
    font-size: 32px;
    color: white;
    cursor: pointer;
    user-select: none;
    padding:10px;
}

.lightbox-arrow.left { left: 10px; }
.lightbox-arrow.right { right: 10px; }

// --- FILMS GRID ---
function renderFilms() {
    let films = Object.keys(database);
    films.sort((a,b) => database[a].year - database[b].year);

    const searchTerm = document.getElementById("filmSearch").value.toLowerCase();
    if(searchTerm) films = films.filter(k => {
        const film = database[k];
        const searchIn = [film.title, ...(film.keywords||[])].join(" ").toLowerCase();
        return searchIn.includes(searchTerm);
    });

    const sortVal = document.getElementById("filmSort").value;
    if(sortVal==="az") films.sort((a,b) => database[a].title.localeCompare(database[b].title));

    document.getElementById("filmGrid").innerHTML = films.map(k=>`
        <div class="film-card" onclick="openLangues('${k}')">
            <img src="${database[k].image}" loading="lazy">
            <div class="film-card-title-overlay">
                <span class="film-card-title-text">${database[k].title}</span>
                <span class="film-card-year">${database[k].year}</span>
            </div>
        </div>
    `).join('');
}
document.getElementById("filmSearch").oninput = renderFilms;
document.getElementById("filmSort").onchange = renderFilms;
renderFilms();

// --- MODAL LANGUES ---
let currentLightboxIndex = 0;
let currentChars = [];

function openLangues(key){
    document.body.style.overflow = "hidden";
    const film = database[key];
    document.getElementById("modalLangues").style.display="flex";
    document.getElementById("logoFilm").src = film.logo;
    document.getElementById("triviaText").innerHTML = film.trivia
                                         .map(t => `– ${t}`)
                                         .join("<br>");

    const langGrid = document.getElementById("langGrid");
    function renderLang(){
        let langs = [];
        film.dubbings.forEach(d=>langs.push(d));
        const search = document.getElementById("langSearch").value.toLowerCase();
        if(search) langs = langs.filter(l=>l.lang.toLowerCase().includes(search));
        const sortVal = document.getElementById("langSort").value;
        if(sortVal==="az") langs.sort((a,b)=>(a.sortName||a.lang).localeCompare(b.sortName||b.lang));
        else langs.sort((a,b)=>a.year.toString().localeCompare(b.year.toString()));

        langGrid.innerHTML = langs.map(l=>`
            <div class="lang-card ${l.link?'clickable':''}" onclick="${l.link ? `window.open('${l.link}','_blank')` : ''}">
                <img class="flag" src="${l.flag}">
                <h3>${l.lang}</h3>
                <p>${l.year.toString().slice(0,4)}</p>
            </div>
        `).join('');
const noDubbingSection = document.getElementById("noDubbingSection");
const noDubbingGrid = document.getElementById("noDubbingGrid");

if(film.nodubbings && film.nodubbings.length > 0) {
    let noLangs = [...film.nodubbings];
    if(search) noLangs = noLangs.filter(l => l.lang.toLowerCase().includes(search));

    if(noLangs.length > 0) {
        noDubbingSection.style.display = "block";
        noDubbingGrid.innerHTML = noLangs.map(l => `
            <div class="lang-card nodubbing">
                <img class="flag" src="${l.flag}">
                <h3>${l.lang}</h3>
            </div>
        `).join('');
    } else {
        noDubbingSection.style.display = "none";
    }
} else {
    noDubbingSection.style.display = "none";
}
    }
    document.getElementById("langSearch").oninput = renderLang;
    document.getElementById("langSort").onchange = renderLang;
    renderLang();

    currentChars = film.characters;
    const gallery = document.getElementById("galleryCharacters");
    gallery.innerHTML = film.characters.map((c,i)=>`
    <div class="character" onclick="openLightboxIndex(${i})">
        <img src="${c.img}"><p>${c.name}</p>
    </div>
`).join('');
}

function closeLangues(){
    document.body.style.overflow = "";
    document.getElementById("modalLangues").style.display="none";
                       }
function openLightboxIndex(i){
    currentLightboxIndex = i;
    const c = currentChars[i];
    document.getElementById("lightbox").style.display="flex";

    const lbImg = document.getElementById("lightbox-img");
    lbImg.src = c.img;
    lbImg.style.cursor = c.link ? "pointer" : "default";
    lbImg.onclick = c.link ? () => window.open(c.link, '_blank') : null;

    document.getElementById("lightbox-title").innerHTML = c.link
        ? `<a href="${c.link}" target="_blank" style="color:white;font-style:italic;">${c.name}</a>`
        : c.name;
}
function closeLightbox(){ document.getElementById("lightbox").style.display="none"; }
function prevLightbox(){ currentLightboxIndex = (currentLightboxIndex-1+currentChars.length)%currentChars.length; openLightboxIndex(currentLightboxIndex); }
function nextLightbox(){ currentLightboxIndex = (currentLightboxIndex+1)%currentChars.length; openLightboxIndex(currentLightboxIndex); }

document.addEventListener('keydown', e=>{
    const lightboxOuverte = document.getElementById("lightbox").style.display === "flex";
    const modalOuverte = document.getElementById("modalLangues").style.display === "flex";

    if(e.key==='Escape'){
        if(lightboxOuverte) closeLightbox();
        else if(modalOuverte) closeLangues();
    }
    if(e.key==='ArrowLeft' && lightboxOuverte) prevLightbox();
    if(e.key==='ArrowRight' && lightboxOuverte) nextLightbox();
});
document.getElementById("modalLangues").addEventListener('click', e=>{
    if(e.target.id==="modalLangues") closeLangues();
});
document.getElementById("lightbox").addEventListener('click', e=>{
    if(e.target.id==="lightbox") closeLightbox();
});

document.addEventListener("mousemove", e => {
    document.querySelectorAll(".film-card").forEach(card => {
        const rect = card.getBoundingClientRect();
        const x = ((e.clientX - rect.left) / rect.width) * 100;
        const y = ((e.clientY - rect.top) / rect.height) * 100;
        card.style.setProperty("--x", x + "%");
        card.style.setProperty("--y", y + "%");
    });
});
