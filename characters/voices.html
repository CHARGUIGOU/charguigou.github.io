<!-- GOOGLE FONT -->
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300..800&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">

<style>
:root {
  --page-margin: 10%;
}

body, .search-input {
  font-family: 'Open Sans', sans-serif !important;
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* ============================================================
   TITRE DE PAGE — réutilisable tel quel sur toutes tes pages
   principales (Home, Character Voices, Movie Cast, etc.)
   MODIFIE ICI les 6 variables : c'est tout ce que tu as à changer.
   ============================================================ */
:root {
  --page-title-font: 'IM Fell English', serif;  /* police d'écriture */
  --page-title-size: 30px;                       /* taille du texte */
  --page-title-weight: 500;                      /* graisse : 100 (très fin) à 900 (très gras) */
  --page-title-spacing: 2px;                     /* espacement entre les lettres */
  --page-title-align: center;                    /* alignement : left / center / right */
  --page-title-color: #222;                      /* couleur du texte */
}

.page-title {
  font-family: var(--page-title-font);
  font-size: var(--page-title-size);
  font-weight: var(--page-title-weight);
  letter-spacing: var(--page-title-spacing);
  text-align: var(--page-title-align);
  color: var(--page-title-color);
  padding-top: 60px;   /* espace au-dessus, laissé à part : propre à chaque page si besoin */
}

/* ============================================================
   DEUX BARRES DE RECHERCHE CÔTE À CÔTE
   ============================================================ */
.search-row {
  display: flex;
  justify-content: center;
  align-items: flex-start;
  gap: 16px;
  flex-wrap: wrap;
  margin: 35px auto 40px;     /*      haut droite bas  gauche */
}

/* Le "or" entre les deux barres : centré verticalement sur toute la
   hauteur de la rangée (label + barre), donc à peu près face aux champs */
.search-or {
  align-self: center;
  font-size: 13px;
  color: #999;
  margin-top: 18px;
}

.search-box {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.search-box label {
  font-size: 11px;
  color: #999;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 4px;
}

.search-input {
  width: 260px;
  padding: 9px 14px;
  font-size: 13px;
  border-radius: 10px;
  border: 1px solid #ccc;
  box-sizing: border-box;
  transition: all 0.3s ease;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}
.search-input:focus {
  outline: none;
  border-color: #7da1c9;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}

/* Compteur de résultats */
#resultCount {
  text-align: center;
  font-size: 12px;
  color: #999;
  margin-bottom: 20px;
}

/* ============================================================
   TITRE DE GROUPE PAR FILM (affiché par défaut / en mode "By film")
   MODIFIE ICI : taille, couleur, espacement au-dessus de chaque film
   ============================================================ */
.film-group {
  margin-bottom: 50px;
}
.film-group-title {
  text-align: center;
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  margin: 0 0 20px;
  padding: 0 var(--page-margin);
  /* Effet lumineux : dégradé radial bleu (mêmes couleurs que le bandeau
     de secours des pages de voix), qui pulse doucement en intensité et
     dérive légèrement, comme une petite luciole à l'intérieur du texte. */
  background: radial-gradient(circle, #2a5da0 0%, #0d2c54 70%);
  background-size: 250% 250%;
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;   /* nécessaire sur Safari en plus de color:transparent */
  color: transparent;
  animation: filmTitleGlow 4s ease-in-out infinite, filmTitleDrift 6s ease-in-out infinite;
}

/* Intensité de la lueur : ajuste 0.85 / 1.3 pour plus ou moins marqué */
@keyframes filmTitleGlow {
  0%, 100% { filter: brightness(0.85); }
  50% { filter: brightness(1.3); }
}

/* Déplacement du point de lumière à l'intérieur du texte */
@keyframes filmTitleDrift {
  0%   { background-position: 30% 40%; }
  25%  { background-position: 65% 30%; }
  50%  { background-position: 70% 65%; }
  75%  { background-position: 35% 70%; }
  100% { background-position: 30% 40%; }
}

/* ============================================================
   FONDU DU CONTENEUR PENDANT UNE RECHERCHE
   MODIFIE ICI : la durée (0.18s) doit correspondre à FADE_MS dans le JS
   ============================================================ */
#charactersContainer {
  transition: opacity 0.18s ease;
  /* La carte grossit de --card-size (100px) à --card-hover-height (225px)
     au survol, soit +125px de hauteur en plus. Ce padding doit rester
     PLUS GRAND que cette différence, sinon la dernière rangée pousse
     la page et oblige à défiler pour la voir en entier au survol. */
  padding-bottom: 220px;
}
#charactersContainer.fading {
  opacity: 0;
}

/* ============================================================
   REGLAGES DE LA CARTE PERSONNAGE
   MODIFIE ICI toutes les valeurs pour ajuster l'apparence :
   inclinaison, espacements, taille et fondu de la photo...
   ============================================================ */
:root {
  --card-tilt: 2deg;              /* inclinaison du polaroïd */
  --card-size: 150px;              /* taille (carré) PAR DÉFAUT de chaque carte */
  --card-hover-width: 200px;       /* largeur au SURVOL (= l'ancienne taille normale) */
  --card-hover-height: 225px;      /* hauteur au SURVOL (garde le ratio 4/4.5 d'origine) */
  --caption-height: 30%;          /* hauteur de la bande du bas, EN % : s'adapte automatiquement, que la carte soit petite ou agrandie */
  --corner-size: 20px;            /* taille des coins "photo" à l'ancienne */
  --corner-color: #d4b876;        /* couleur des coins (plus claire) */
  --card-tint: rgba(250, 247, 240, 0.65);  /* couleur/opacité du verre teinté du dos de carte */
  --card-blur: 6px;                /* intensité du flou "vitré" du dos de carte */
  --name-font: 'IM Fell English', serif;  /* police du nom du personnage */
  --name-font-size: 13px;          /* taille du nom du personnage (visible uniquement sur le recto, jamais vraiment vue en grand puisque le survol retourne la carte) */
}

/* ============================================================
   GRILLE DE PERSONNAGES
   "auto-fill" + "minmax" calcule automatiquement le nombre de colonnes
   qui tiennent sur la largeur disponible, en fonction de --card-size
   ci-dessus : plus besoin de fixer un nombre de colonnes par palier
   d'écran (les media queries à ce sujet, en bas du fichier, ne sont
   donc plus nécessaires et ont été retirées).
   ============================================================ */
.character-grid {
  list-style: none;
  padding: 0 var(--page-margin);
  margin: 0;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(var(--card-size), 1fr));
  gap: 18px;
  box-sizing: border-box;
}

/* Carte : un petit carré par défaut, qui grossit au survol jusqu'à la
   taille "normale" d'origine (200 x 225px). z-index monte au survol
   pour que la carte agrandie passe bien AU-DESSUS de ses voisines
   plutôt que d'être coupée par elles. */
.character-card {
  position: relative;
  width: var(--card-size);
  height: var(--card-size);
  margin: 0 auto;
  perspective: 1000px;
  cursor: pointer;
  z-index: 1;
  transition: width 0.3s ease, height 0.3s ease;
}
.character-card:hover {
  width: var(--card-hover-width);
  height: var(--card-hover-height);
  z-index: 10;
}

.character-card.no-link {
  cursor: default;
}

/* Coins "photo" à l'ancienne, façon scrapbook, sur les 4 coins de chaque face */
.corner {
  position: absolute;
  width: var(--corner-size);
  height: var(--corner-size);
  background: var(--corner-color);
  pointer-events: none;
}
.corner-tl {
  top: 0;
  left: 0;
  clip-path: polygon(0 0, 100% 0, 0 100%);
}
.corner-tr {
  top: 0;
  right: 0;
  clip-path: polygon(100% 0, 0 0, 100% 100%);
}
.corner-bl {
  bottom: 0;
  left: 0;
  clip-path: polygon(0 100%, 0 0, 100% 100%);
}
.corner-br {
  bottom: 0;
  right: 0;
  clip-path: polygon(100% 100%, 100% 0, 0 100%);
}

.flip-inner {
  position: absolute;
  inset: 0;
  transition: transform 0.6s ease;
  transform-style: preserve-3d;
}
.character-card:hover .flip-inner {
  transform: rotateY(180deg);
}

.card-face {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  border-radius: 4px;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
  display: flex;
  flex-direction: column;
  align-items: center;
  box-sizing: border-box;
  overflow: hidden;
}

/* Face avant : photo plein cadre, façon polaroïd incliné */
.card-front {
  padding: 0;
  overflow: hidden;
  justify-content: flex-start;
  transform: rotate(var(--card-tilt));
}

.photo-frame {
  position: absolute;
  inset: 0;
  overflow: hidden;
}

/* Photo unique, plein cadre */
.photo-frame .photo-main {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: top;
}

/* Bande du bas : simple dégradé sombre, fiable sur tous les navigateurs */
.card-caption {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: var(--caption-height);
  background: linear-gradient(to top, rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0));
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding-bottom: 10px;
  box-sizing: border-box;
}

.character-name {
  font-family: var(--name-font);
  font-size: var(--name-font-size);
  font-weight: 300;
  color: #fff;
  text-align: center;
}

/* Face arrière : liste complète des apparitions, défilement auto au survol (voir JS) */
.card-back {
  background: var(--card-tint);
  backdrop-filter: blur(var(--card-blur));
  -webkit-backdrop-filter: blur(var(--card-blur));
  border: 1px solid rgba(255, 255, 255, 0.5);
  transform: rotate(var(--card-tilt)) rotateY(180deg);
  justify-content: flex-start;
  padding: 14px;
  overflow-y: auto;
  /* Masque la barre de défilement classique : le défilement se fait via le mouvement de la souris */
  scrollbar-width: none;
  -ms-overflow-style: none;
}
.card-back::-webkit-scrollbar {
  display: none;
}

.card-back-count {
  font-size: 12px;
  font-weight: 700;
  color: #1a4a8a;
  margin-bottom: 8px;
  text-align: center;
}

.card-back-list {
  list-style: none;
  padding: 0;
  margin: 0 0 8px;
  width: 100%;
}

.card-back-list li {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 6px;
  font-size: 10.5px;
  color: #444;
  padding: 4px 0;
  border-bottom: 1px solid #f0f0f0;
}
.card-back-list li:last-child {
  border-bottom: none;
}

.card-back-film {
  text-align: left;
}

.card-back-year {
  font-weight: 700;
  color: #1a4a8a;
  white-space: nowrap;
}

.card-back-hint {
  font-size: 10px;
  color: #999;
  font-style: italic;
  text-align: center;
}

/* ============================================================
   BADGE "UPCOMING" (utilisé au dos de la carte)
   ============================================================ */
.upcoming-badge {
  display: inline-block;
  background: #d9534f;
  color: #fff;
  font-size: 8px;
  font-weight: 700;
  text-transform: uppercase;
  padding: 1px 5px;
  border-radius: 4px;
  margin-left: 6px;
}
</style>

<div class="page-title">CHARACTER VOICES</div>

<div class="search-row">
  <div class="search-box">
    <label for="charSearch">By character</label>
    <input type="text" id="charSearch" class="search-input" placeholder="Search by character..." />
  </div>
  <span class="search-or">or</span>
  <div class="search-box">
    <label for="filmSearch">By film</label>
    <input type="text" id="filmSearch" class="search-input" placeholder="Search by film title..." />
  </div>
</div>
<div id="resultCount"></div>

<!-- ============================================================
     MODIFIE ICI (structure) : ce conteneur est rempli par le script.
     Par défaut, il contient un .film-group par film (avec son titre)
     ; pendant une recherche "By character", il ne contient plus
     qu'une seule grille plate, sans titre.
     ============================================================ -->
<div id="charactersContainer"></div>

<script>
// ============================================================
//  CHARACTER DATA
//  MODIFIE ICI : ajoute un objet par personnage.
//  Fields:
//    name        : nom affiché sur la carte
//    img         : URL de l'image (portrait du personnage)
//    franchise   : nom de la saga (ex: "Toy Story", "Cinderella"). Sert à
//                  regrouper les personnages ensemble même si certains
//                  n'apparaissent qu'à partir d'une suite (ex: Jessie
//                  n'apparaît qu'à partir de Toy Story 2, mais reste
//                  rangée avec Woody et Buzz grâce à ce champ).
//    keywords    : (optionnel) tableau de mots-clés invisibles supplémentaires
//                  pour la recherche "By character" (surnom, orthographe
//                  alternative, nom dans une autre langue...)
//    link        : URL de la fiche complète du personnage. Tant que ce champ
//                  n'est pas rempli, la carte affiche "Full profile coming
//                  soon" au dos et n'est pas cliquable.
//    appearances : liste des films où il apparaît (affichée en entier au dos de la carte)
//        film     : titre du film
//        year     : année
//        keywords : (optionnel) tableau de mots-clés invisibles supplémentaires
//                   pour la recherche "By film" (autre orthographe, chiffre
//                   romain vs normal, titre alternatif...)
//        upcoming : true si le doublage/la page n'est pas encore sortie (affiche un badge rouge)
//
//  ORDRE D'AFFICHAGE PAR DÉFAUT : les personnages sont maintenant
//  regroupés par film (voir plus bas). À l'intérieur d'un même film,
//  l'ordre suit simplement l'ordre dans lequel tu écris les personnages
//  ci-dessous — donc pour avoir "Snow White, puis Evil Queen, puis
//  Prince Charming" sous le film de 1937, écris-les dans cet ordre.
// ============================================================

const PIC = "https://res.cloudinary.com/dofvjifeo/image/upload/";

const characters = [

  {
    name: "Snow White",
    img: PIC + "SnowWhite1937.png",
    franchise: "Snow White",
    link: "/characters/list/snowwhite.html",
    appearances: [
      { film: "Snow White and the Seven Dwarfs", year: "1937" },
      { film: "Sofia the First: The Enchanted Feast", year: "2014" },
      { film: "Ralph Breaks the Internet", year: "2018" },
      { film: "LEGO Disney Princess: The Castle Quest", year: "2023" },
      { film: "Once Upon a Studio", year: "2023" },
      { film: "Snow White (live-action)", year: "2025" },
      { film: "LEGO Disney Princess: Villains Unite", year: "2025" },
      { film: "LEGO Disney Princess: Magical Mayhem", year: "2026" }
    ]
  },

  {
    name: "Evil Queen / Hag",
    img: PIC + "EvilQueen1937.png",
    franchise: "Snow White",
    appearances: [
      { film: "Snow White and the Seven Dwarfs", year: "1937" },
      { film: "Snow White (live-action)", year: "2025" },
      { film: "LEGO Disney Princess: Villains Unite", year: "2025" }
    ]
  },

  {
    name: "Prince Charming",
    img: PIC + "PrinceCharmingSW1937.png",
    franchise: "Snow White",
    keywords: ["Florian"],
    appearances: [
      { film: "Snow White and the Seven Dwarfs", year: "1937" },
    ]
  },

  {
    name: "Cinderella",
    img: PIC + "Cinderella1950.png",
    franchise: "Cinderella",
    keywords: ["cenicienta", "cendrillon"],
    appearances: [
      { film: "Cinderella", year: "1950" },
      { film: "Disney's House of Mouse", year: "2001", upcoming:true },
      { film: "Cinderella II: Dreams Come True", year: "2002", keywords: ["cinderella 2: dreams come true"] },
      { film: "Cinderella III: A Twist in Time", year: "2007", keywords: ["cinderella 3"] },
      { film: "Sofia the First: Once Upon a Princess", year: "2012" },
      { film: "Cinderella (live-action)", year: "2015" },
      { film: "Ralph Breaks the Internet", year: "2018" },
      { film: "Once Upon a Studio", year: "2023" },
      { film: "LEGO Disney Princess: Villains Unite", year: "2025" }
    ]
  },

  {
    name: "Lady Tremaine",
    img: PIC + "LadyTremaine1950.png",
    franchise: "Cinderella",
    keywords: ["stepmother"],
    appearances: [
      { film: "Cinderella", year: "1950" },
      { film: "Cinderella II: Dreams Come True", year: "2002", keywords: ["cinderella 2: dreams come true"] },
      { film: "Cinderella III: A Twist in Time", year: "2007", keywords: ["cinderella 3"] },
      { film: "Cinderella (live-action)", year: "2015" },
    ]
  },

  {
    name: "Prince Charming",
    img: PIC + "PrinceCharming1950.png",
    franchise: "Cinderella",
    keywords: ["Henry", "Kit"],
    appearances: [
      { film: "Cinderella", year: "1950" },
      { film: "Cinderella II: Dreams Come True", year: "2002", keywords: ["cinderella 2: dreams come true"] },
      { film: "Cinderella III: A Twist in Time", year: "2007", keywords: ["cinderella 3"] },
      { film: "Cinderella (live-action)", year: "2015" },
      { film: "Once Upon a Studio", year: "2023" },
    ]
  },

  // ── MODELE A DUPLIQUER POUR CHAQUE NOUVEAU PERSONNAGE ────────
  // {
  //   name: "NOM DU PERSONNAGE",
  //   img: PIC + "nomdufichierimage.png",
  //   franchise: "Nom de la saga", // ex: "Toy Story" — sert au tri/regroupement
  //   keywords: ["surnom", "autre orthographe"], // optionnel, à retirer si pas besoin
  //   link: "/characters/nomdufichier.html", // à retirer si la page n'existe pas encore
  //   appearances: [
  //     { film: "Titre du film", year: "Année" },
  //     { film: "Titre du film 2", year: "Année 2", keywords: ["autre orthographe"], upcoming: true }
  //   ]
  // },

];

// ============================================================
//  CONSTRUCTION DES GROUPES PAR SAGA (VUE PAR DÉFAUT)
//  Chaque personnage n'apparaît qu'UNE SEULE FOIS, sous sa propre saga
//  (champ "franchise"), peu importe le nombre de films où il apparaît.
//  Les sagas sont triées chronologiquement (année du 1er film de la
//  saga), et à l'intérieur d'une saga, les personnages sont triés par
//  leur PROPRE première apparition (ex: Jessie, qui arrive dans Toy
//  Story 2, reste bien après Woody et Buzz).
// ============================================================

function firstYear(character) {
  return Math.min(...character.appearances.map(a => parseInt(a.year, 10) || Infinity));
}

const sagaMap = {}; // { "Nom de la saga": { anchorYear, entries: [character, ...] } }

characters.forEach(character => {
  const key = character.franchise || character.name;
  const y = firstYear(character);
  if (!sagaMap[key]) {
    sagaMap[key] = { anchorYear: y, entries: [] };
  } else if (y < sagaMap[key].anchorYear) {
    sagaMap[key].anchorYear = y;
  }
  sagaMap[key].entries.push(character);
});

// Trie les personnages DANS chaque saga par leur propre première année
Object.values(sagaMap).forEach(saga => {
  saga.entries.sort((a, b) => firstYear(a) - firstYear(b));
});

const sagaKeysInOrder = Object.keys(sagaMap).sort((a, b) => sagaMap[a].anchorYear - sagaMap[b].anchorYear);

// ============================================================
//  CONSTRUCTION DES GROUPES PAR FILM (RECHERCHE "By film" UNIQUEMENT)
//  Pour chaque personnage, pour chacune de ses apparitions, on range
//  le personnage dans le groupe du film correspondant. Un même
//  personnage peut donc se retrouver dans plusieurs groupes (un par
//  film où il apparaît) — normal, puisque ceci ne sert QUE pour la
//  recherche par film. Un même personnage peut apparaître dans plusieurs
//  groupes affichés en même temps (ex: dans les 3 films LEGO) : c'est
//  voulu, pour voir clairement le casting complet de chaque film pris
//  individuellement (voir renderGrouped un peu plus bas).
// ============================================================

const filmMap = {}; // { "Titre du film": { year, entries: [character, ...], searchText } }

characters.forEach(character => {
  character.appearances.forEach(a => {
    if (!filmMap[a.film]) {
      filmMap[a.film] = { year: a.year, entries: [], keywords: new Set() };
    }
    filmMap[a.film].entries.push(character);
    // Les mots-clés d'apparition (ex: "cinderella 2") viennent s'ajouter
    // au texte de recherche de CE film, peu importe quel personnage les a définis.
    (a.keywords || []).forEach(k => filmMap[a.film].keywords.add(k));
  });
});

// Texte de recherche final par film : titre + tous ses mots-clés
Object.keys(filmMap).forEach(title => {
  filmMap[title].searchText = (title + ' ' + [...filmMap[title].keywords].join(' ')).toLowerCase();
});

// Ordre des films : chronologique (par année). Modifie ce tri si tu
// préfères un autre ordre (ex: alphabétique).
const filmTitlesInOrder = Object.keys(filmMap).sort((a, b) => {
  const yearA = parseInt(filmMap[a].year, 10) || 9999;
  const yearB = parseInt(filmMap[b].year, 10) || 9999;
  return yearA - yearB;
});

// ============================================================
//  RENDERING
// ============================================================

const container = document.getElementById('charactersContainer');

function buildCharacterCard(character) {
  const li = document.createElement('li');
  li.className = 'character-card';

  const hasLink = !!character.link;
  if (!hasLink) li.classList.add('no-link');

  li.innerHTML = `
    <div class="flip-inner">
      <div class="card-face card-front">
        <div class="photo-frame">
          <img class="photo-main" src="${character.img}" alt="${character.name}">
          <div class="card-caption">
            <span class="character-name">${character.name}</span>
          </div>
        </div>
        <span class="corner corner-tl"></span>
        <span class="corner corner-tr"></span>
        <span class="corner corner-bl"></span>
        <span class="corner corner-br"></span>
      </div>
      <div class="card-face card-back">
        <span class="card-back-count">${character.appearances.length} appearance${character.appearances.length > 1 ? 's' : ''}</span>
        <ul class="card-back-list">
          ${character.appearances.map(a => `
            <li>
              <span class="card-back-film">${a.film}</span>
              <span class="card-back-year">${a.year}${a.upcoming ? '<span class="upcoming-badge">Upcoming</span>' : ''}</span>
            </li>
          `).join('')}
        </ul>
        <span class="card-back-hint">${hasLink ? 'Click to view full profile' : 'Full profile coming soon'}</span>
      </div>
    </div>
  `;

  if (hasLink) {
    li.addEventListener('click', () => { window.location.href = character.link; });
  }

  setupAutoScroll(li);
  setupNeighborPush(li);

  return li;
}

// Affichage GROUPÉ PAR SAGA (VUE PAR DÉFAUT) : chaque personnage une seule fois
function renderBySaga() {
  container.innerHTML = '';
  sagaKeysInOrder.forEach(key => {
    const saga = sagaMap[key];
    if (!saga || saga.entries.length === 0) return;

    const section = document.createElement('div');
    section.className = 'film-group';

    const heading = document.createElement('h2');
    heading.className = 'film-group-title';
    heading.textContent = key;
    section.appendChild(heading);

    const ul = document.createElement('ul');
    ul.className = 'character-grid';
    saga.entries.forEach(character => ul.appendChild(buildCharacterCard(character)));
    section.appendChild(ul);

    container.appendChild(section);
  });
}

// Affichage GROUPÉ PAR FILM (recherche "By film" uniquement) : chaque film
// correspondant affiche TOUS ses personnages, même si certains apparaissent
// aussi dans un autre film déjà affiché juste au-dessus (ex: Snow White dans
// les 3 films LEGO) — c'est voulu, pour voir clairement le casting complet
// de chaque film pris individuellement.
function renderGrouped(titles) {
  container.innerHTML = '';

  titles.forEach(title => {
    const group = filmMap[title];
    if (!group || group.entries.length === 0) return;

    const section = document.createElement('div');
    section.className = 'film-group';

    const heading = document.createElement('h2');
    heading.className = 'film-group-title';
    heading.textContent = `${title}${group.year ? ' (' + group.year + ')' : ''}`;
    section.appendChild(heading);

    const ul = document.createElement('ul');
    ul.className = 'character-grid';
    group.entries.forEach(character => ul.appendChild(buildCharacterCard(character)));
    section.appendChild(ul);

    container.appendChild(section);
  });
}

// Affichage PLAT (mode "By character" pendant une recherche) : pas de titre, pas de regroupement
function renderFlat(list) {
  container.innerHTML = '';
  const ul = document.createElement('ul');
  ul.className = 'character-grid';
  list.forEach(character => ul.appendChild(buildCharacterCard(character)));
  container.appendChild(ul);
}

// ============================================================
//  POUSSÉE DES VOISINES SUR LA MÊME LIGNE (EXPÉRIMENTAL)
//  Au survol, mesure quelles cartes partagent la même ligne (même
//  position verticale) que la carte survolée, et les décale sur le
//  côté pour "faire de la place" — effet façon Netflix. Contrairement
//  au tassement vertical (qui vient gratuitement de la grille CSS),
//  ceci est fait "à la main" en JS car CSS Grid ne recalcule pas la
//  largeur des colonnes voisines automatiquement.
//  SI CET EFFET NE TE CONVIENT PAS : retire simplement l'appel
//  "setupNeighborPush(li);" juste au-dessus, et cette fonction entière
//  peut être supprimée sans rien casser d'autre.
// ============================================================

function setupNeighborPush(li) {
  let pushedSiblings = [];

  li.addEventListener('mouseenter', () => {
    const rowTop = li.offsetTop;
    const allInGrid = Array.from(li.parentElement.children);
    // Cartes qui partagent (à peu près) la même position verticale = même ligne
    const rowSiblings = allInGrid.filter(el => Math.abs(el.offsetTop - rowTop) < 4);
    const idx = rowSiblings.indexOf(li);

    const rootStyle = getComputedStyle(document.documentElement);
    const sizeDefault = parseFloat(rootStyle.getPropertyValue('--card-size'));
    const sizeHover = parseFloat(rootStyle.getPropertyValue('--card-hover-width'));
    const shift = (sizeHover - sizeDefault) / 2 + 9; // + la moitié de l'espacement (gap) entre cartes

    pushedSiblings = rowSiblings.filter(el => el !== li);
    pushedSiblings.forEach(sib => {
      const sibIdx = rowSiblings.indexOf(sib);
      sib.style.transition = 'transform 0.3s ease';
      sib.style.transform = sibIdx < idx ? `translateX(-${shift}px)` : `translateX(${shift}px)`;
    });
  });

  li.addEventListener('mouseleave', () => {
    pushedSiblings.forEach(sib => { sib.style.transform = ''; });
    pushedSiblings = [];
  });
}

// ============================================================
//  AUTO-SCROLL DE LA LISTE AU DOS DE LA CARTE
//  MODIFIE ICI :
//    DEAD_ZONE   : la zone centrale (en %) où la souris ne fait rien défiler.
//                  0.35 veut dire que les 35% du haut et les 35% du bas
//                  déclenchent le défilement, le milieu (30%) reste neutre.
//    MAX_SPEED   : vitesse maximale de défilement (en pixels par frame),
//                  atteinte quand la souris est tout en haut ou tout en bas.
// ============================================================

const DEAD_ZONE = 0.35;
const MAX_SPEED = 3;

function setupAutoScroll(li) {
  const backEl = li.querySelector('.card-back');
  let speed = 0;
  let rafId = null;

  function step() {
    if (speed !== 0) {
      backEl.scrollTop += speed;
    }
    rafId = requestAnimationFrame(step);
  }

  li.addEventListener('mousemove', (e) => {
    const rect = li.getBoundingClientRect();
    const relY = (e.clientY - rect.top) / rect.height; // 0 = haut, 1 = bas

    if (relY < DEAD_ZONE) {
      const intensity = (DEAD_ZONE - relY) / DEAD_ZONE; // 0 à 1
      speed = -intensity * MAX_SPEED;
    } else if (relY > 1 - DEAD_ZONE) {
      const intensity = (relY - (1 - DEAD_ZONE)) / DEAD_ZONE;
      speed = intensity * MAX_SPEED;
    } else {
      speed = 0;
    }
  });

  li.addEventListener('mouseenter', () => {
    if (!rafId) step();
  });

  li.addEventListener('mouseleave', () => {
    speed = 0;
    if (rafId) {
      cancelAnimationFrame(rafId);
      rafId = null;
    }
  });
}

// ============================================================
//  SEARCH
//  - Query vide            → toujours la vue groupée par saga (par défaut)
//  - Mode "By character"   → liste plate des personnages correspondants,
//                            sans titre ni regroupement
//  - Mode "By film"        → ne garde que le(s) film(s) dont le TITRE (ou
//                            les mots-clés d'apparition) correspond à la
//                            recherche, toujours affiché avec son titre
// ============================================================

const charSearchInput = document.getElementById('charSearch');
const filmSearchInput = document.getElementById('filmSearch');
const resultCount = document.getElementById('resultCount');

function applySearch() {
  const charQuery = charSearchInput.value.toLowerCase().trim();
  const filmQuery = filmSearchInput.value.toLowerCase().trim();

  if (charQuery === '' && filmQuery === '') {
    renderBySaga();
    resultCount.textContent = '';
    return;
  }

  if (filmQuery !== '') {
    const matchingTitles = filmTitlesInOrder.filter(title => filmMap[title].searchText.includes(filmQuery));
    renderGrouped(matchingTitles);
    resultCount.textContent = `${matchingTitles.length} film${matchingTitles.length !== 1 ? 's' : ''} found`;
    return;
  }

  // charQuery !== ''
  const matches = characters.filter(character => {
    const keywordText = character.keywords ? ' ' + character.keywords.join(' ') : '';
    const searchName = (character.name + keywordText).toLowerCase();
    return searchName.includes(charQuery);
  });
  renderFlat(matches);
  resultCount.textContent = `${matches.length} character${matches.length !== 1 ? 's' : ''} found`;
}

// ============================================================
//  FONDU AUTOUR DE CHAQUE RECHERCHE
//  Au lieu de reconstruire le contenu instantanément, on l'estompe
//  d'abord, on remplace le contenu PENDANT qu'il est invisible, puis
//  on le fait réapparaître en fondu. Beaucoup plus simple/fiable que
//  d'animer chaque carte individuellement dans une grille qui change
//  de structure (regroupée ↔ plate) à chaque frappe.
//  FADE_MS doit correspondre à la durée dans le CSS (transition: opacity ...).
// ============================================================

const FADE_MS = 180;
let fadeTimeout = null;

function applySearchWithFade() {
  container.classList.add('fading');

  // Si l'utilisateur tape vite, on annule le rendu précédent en attente
  // pour ne pas empiler plusieurs reconstructions inutiles.
  if (fadeTimeout) clearTimeout(fadeTimeout);

  fadeTimeout = setTimeout(() => {
    applySearch();
    container.classList.remove('fading');
    fadeTimeout = null;
  }, FADE_MS);
}

// Taper dans une barre vide automatiquement l'autre, pour ne jamais avoir
// les deux recherches actives en même temps (ce qui serait ambigu).
charSearchInput.addEventListener('input', () => {
  if (charSearchInput.value !== '') filmSearchInput.value = '';
  applySearchWithFade();
});
filmSearchInput.addEventListener('input', () => {
  if (filmSearchInput.value !== '') charSearchInput.value = '';
  applySearchWithFade();
});

// Rendu initial au chargement de la page
renderBySaga();
</script>
