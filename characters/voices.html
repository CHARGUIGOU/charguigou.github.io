---
layout: null
---
{% include header.html %}
<!-- GOOGLE FONT -->
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300..800&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">

<style>
:root {
  --page-margin: 10%;
}

body, #charSearch {
  font-family: 'Open Sans', sans-serif !important;
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* ============================================================
   TITRE DE PAGE
   ============================================================ */
.page-title {
  text-align: center;
  padding-top: 60px;
  font-size: 26px;
  font-weight: 600;
  color: #222;
  letter-spacing: 1px;
}

/* ============================================================
   BARRE DE RECHERCHE
   ============================================================ */
#charSearch {
  width: 320px;
  padding: 9px 14px;
  font-size: 13px;
  border-radius: 10px;
  border: 1px solid #ccc;
  margin: 24px auto 10px;
  display: block;
  box-sizing: border-box;
  transition: all 0.3s ease;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}
#charSearch:focus {
  outline: none;
  border-color: #7da1c9;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}

.search-hint {
  text-align: center;
  font-size: 12px;
  color: #888;
  margin-bottom: 16px;
}

/* Bouton bascule "By character" / "By film" */
.search-mode-toggle {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-bottom: 20px;
}
.mode-btn {
  font-family: 'Open Sans', sans-serif;
  font-size: 12px;
  padding: 5px 16px;
  border-radius: 20px;
  border: 1px solid #ccc;
  background: #f5f5f5;
  color: #333;
  cursor: pointer;
  transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
}
.mode-btn:hover:not(.active) {
  background: #e8e8e8;
}
.mode-btn.active {
  background: #1a4a8a;
  border-color: #1a4a8a;
  color: #fff;
}

/* Compteur de résultats */
#resultCount {
  text-align: center;
  font-size: 12px;
  color: #999;
  margin-bottom: 20px;
}

/* ============================================================
   REGLAGES DE LA CARTE PERSONNAGE
   MODIFIE ICI toutes les valeurs pour ajuster l'apparence :
   inclinaison, espacements, taille et fondu de la photo...
   ============================================================ */
:root {
  --card-tilt: 2deg;              /* inclinaison du polaroïd */
  --card-ratio: 4 / 4.5;          /* rapport largeur/hauteur de la carte (plus petit = carte moins haute) */
  --card-max-width: 200px;        /* largeur maximale d'une carte (plus petit = cartes plus petites) */
  --caption-height: 70px;         /* hauteur de la bande du bas (dégradé sombre) */
  --corner-size: 20px;            /* taille des coins "photo" à l'ancienne */
  --corner-color: #d4b876;        /* couleur des coins (plus claire) */
  --card-tint: rgba(250, 247, 240, 0.65);  /* couleur/opacité du verre teinté du dos de carte */
  --card-blur: 6px;                /* intensité du flou "vitré" du dos de carte */
  --name-font: 'IM Fell English', serif;  /* police du nom du personnage */
  --name-font-size: 18px;          /* taille du nom du personnage */
}

/* ============================================================
   GRILLE DE PERSONNAGES
   ============================================================ */
.character-grid {
  list-style: none;
  padding: 20 var(--page-margin) 100px;
  margin: 0;
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 18px;
  box-sizing: border-box;
}

.character-card {
  position: relative;
  width: 100%;
  max-width: var(--card-max-width);
  margin: 0 auto;
  aspect-ratio: var(--card-ratio);
  perspective: 1000px;
  cursor: pointer;
  opacity: 1;
  transform: scale(1);
  transition: opacity 0.25s ease, transform 0.25s ease;
}

.character-card.no-link {
  cursor: default;
}

/* Etat transitoire pendant le filtrage de recherche (voir JS applySearch) */
.character-card.hiding {
  opacity: 0;
  transform: scale(0.85);
  pointer-events: none;
}

/* Coins "photo" à l'ancienne, façon scrapbook, sur les 4 coins de chaque face */
.corner {
  position: absolute;
  width: var(--corner-size);
  height: var(--corner-size);
  background: var(--corner-color);
  pointer-events: none;
}
.corner-tl {
  top: 0;
  left: 0;
  clip-path: polygon(0 0, 100% 0, 0 100%);
}
.corner-tr {
  top: 0;
  right: 0;
  clip-path: polygon(100% 0, 0 0, 100% 100%);
}
.corner-bl {
  bottom: 0;
  left: 0;
  clip-path: polygon(0 100%, 0 0, 100% 100%);
}
.corner-br {
  bottom: 0;
  right: 0;
  clip-path: polygon(100% 100%, 100% 0, 0 100%);
}

.flip-inner {
  position: absolute;
  inset: 0;
  transition: transform 0.6s ease;
  transform-style: preserve-3d;
}
.character-card:hover .flip-inner {
  transform: rotateY(180deg);
}

.card-face {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  border-radius: 4px;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
  display: flex;
  flex-direction: column;
  align-items: center;
  box-sizing: border-box;
  overflow: hidden;
}

/* Face avant : photo plein cadre, façon polaroïd incliné */
.card-front {
  padding: 0;
  overflow: hidden;
  justify-content: flex-start;
  transform: rotate(var(--card-tilt));
}

.photo-frame {
  position: absolute;
  inset: 0;
  overflow: hidden;
}

/* Photo unique, plein cadre */
.photo-frame .photo-main {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: top;
}

/* Bande du bas : simple dégradé sombre, fiable sur tous les navigateurs */
.card-caption {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: var(--caption-height);
  background: linear-gradient(to top, rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0));
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding-bottom: 10px;
  box-sizing: border-box;
}

.character-name {
  font-family: var(--name-font);
  font-size: var(--name-font-size);
  font-weight: 400;
  color: #fff;
  text-align: center;
}

/* Face arrière : liste complète des apparitions, défilement auto au survol (voir JS) */
.card-back {
  background: var(--card-tint);
  backdrop-filter: blur(var(--card-blur));
  -webkit-backdrop-filter: blur(var(--card-blur));
  border: 1px solid rgba(255, 255, 255, 0.5);
  transform: rotate(var(--card-tilt)) rotateY(180deg);
  justify-content: flex-start;
  padding: 14px;
  overflow-y: auto;
  /* Masque la barre de défilement classique : le défilement se fait via le mouvement de la souris */
  scrollbar-width: none;
  -ms-overflow-style: none;
}
.card-back::-webkit-scrollbar {
  display: none;
}

.card-back-count {
  font-size: 12px;
  font-weight: 700;
  color: #1a4a8a;
  margin-bottom: 8px;
  text-align: center;
}

.card-back-list {
  list-style: none;
  padding: 0;
  margin: 0 0 8px;
  width: 100%;
}

.card-back-list li {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 6px;
  font-size: 10.5px;
  color: #444;
  padding: 4px 0;
  border-bottom: 1px solid #f0f0f0;
}
.card-back-list li:last-child {
  border-bottom: none;
}

.card-back-film {
  text-align: left;
}

.card-back-year {
  font-weight: 700;
  color: #1a4a8a;
  white-space: nowrap;
}

.card-back-hint {
  font-size: 10px;
  color: #999;
  font-style: italic;
  text-align: center;
}

/* ============================================================
   BADGE "UPCOMING" (utilisé au dos de la carte)
   ============================================================ */
.upcoming-badge {
  display: inline-block;
  background: #d9534f;
  color: #fff;
  font-size: 8px;
  font-weight: 700;
  text-transform: uppercase;
  padding: 1px 5px;
  border-radius: 4px;
  margin-left: 6px;
}

@media (max-width: 1300px) {
  .character-grid { grid-template-columns: repeat(4, 1fr); }
}
@media (max-width: 900px) {
  .character-grid { grid-template-columns: repeat(3, 1fr); }
}
@media (max-width: 500px) {
  .character-grid { grid-template-columns: repeat(2, 1fr); }
}
</style>

<div class="page-title">Character Voices</div>

<input type="text" id="charSearch" placeholder="Search by character..." />
<div class="search-mode-toggle">
  <button class="mode-btn active" data-mode="name" type="button">By character</button>
  <button class="mode-btn" data-mode="film" type="button">By film</button>
</div>
<div class="search-hint">Tip: switch to "By film" to see every character who appears in it</div>
<div id="resultCount"></div>

<ul class="character-grid" id="characterGrid"></ul>

<script>
// ============================================================
//  CHARACTER DATA
//  MODIFIE ICI : ajoute un objet par personnage.
//  Fields:
//    name        : nom affiché sur la carte
//    img         : URL de l'image (portrait du personnage)
//    franchise   : nom de la saga (ex: "Toy Story", "Cinderella"). Sert à
//                  regrouper les personnages ensemble même si certains
//                  n'apparaissent qu'à partir d'une suite (ex: Jessie
//                  n'apparaît qu'à partir de Toy Story 2, mais reste
//                  rangée avec Woody et Buzz grâce à ce champ).
//    keywords    : (optionnel) tableau de mots-clés invisibles supplémentaires
//                  pour la recherche "By character" (surnom, orthographe
//                  alternative, nom dans une autre langue...)
//    link        : URL de la fiche complète du personnage. Tant que ce champ
//                  n'est pas rempli, la carte affiche "Full profile coming
//                  soon" au dos et n'est pas cliquable.
//    appearances : liste des films où il apparaît (affichée en entier au dos de la carte)
//        film     : titre du film
//        year     : année
//        keywords : (optionnel) tableau de mots-clés invisibles supplémentaires
//                   pour la recherche "By film" (autre orthographe, chiffre
//                   romain vs normal, titre alternatif...)
//        upcoming : true si le doublage/la page n'est pas encore sortie (affiche un badge rouge)
// ============================================================

const PIC = "https://res.cloudinary.com/dofvjifeo/image/upload/";

const characters = [

  {
    name: "Snow White",
    img: PIC + "SnowWhite1937.png",
    franchise: "Snow White",
    keywords: ["blanche neige", "princess snow white"],
    link: "/characters/snowwhite.html",
    appearances: [
      { film: "Snow White and the Seven Dwarfs", year: "1937" },
      { film: "Sofia the First: The Enchanted Feast", year: "2014" },
      { film: "Ralph Breaks the Internet", year: "2018" },
      { film: "LEGO Disney Princess: The Castle Quest", year: "2023" },
      { film: "Once Upon a Studio", year: "2023" },
      { film: "Snow White (live-action)", year: "2025" },
      { film: "LEGO Disney Princess: Villains Unite", year: "2025" },
      { film: "LEGO Disney Princess: Magical Mayhem", year: "2026" }
    ]
  },

  {
    name: "Evil Queen / Hag",
    img: PIC + "EvilQueen1937.png",
    franchise: "Snow White",
    appearances: [
      { film: "Snow White and the Seven Dwarfs", year: "1937" },
      { film: "Snow White (live-action)", year: "2025" },
      { film: "LEGO Disney Princess: Villains Unite", year: "2025" }
    ]
  },

  {
    name: "Prince Charming",
    img: PIC + "PrinceCharmingSW1937.png",
    franchise: "Snow White",
    keywords: ["Florian"],
    appearances: [
      { film: "Snow White and the Seven Dwarfs", year: "1937" },
    ]
  },

  {
    name: "Cinderella",
    img: PIC + "Cinderella1950.png",
    franchise: "Cinderella",
    keywords: ["cenicienta", "cendrillon"],
    appearances: [
      { film: "Cinderella", year: "1950" },
      { film: "Disney's House of Mouse", year: "2001", upcoming:true },
      { film: "Cinderella II: Dreams Come True", year: "2002", keywords: ["cinderella 2: dreams come true"] },
      { film: "Cinderella III: A Twist in Time", year: "2007", keywords: ["cinderella 3"] },
      { film: "Cinderella (live-action)", year: "2015" },
      { film: "Ralph Breaks the Internet", year: "2018" },
      { film: "Once Upon a Studio", year: "2023" },
      { film: "LEGO Disney Princess: Villains Unite", year: "2025" }
    ]
  },

  {
    name: "Lady Tremaine",
    img: PIC + "LadyTremaine1950.png",
    franchise: "Cinderella",
    keywords: ["stepmother"],
    appearances: [
      { film: "Cinderella", year: "1950" },
      { film: "Cinderella II: Dreams Come True", year: "2002", keywords: ["cinderella 2: dreams come true"] },
      { film: "Cinderella III: A Twist in Time", year: "2007", keywords: ["cinderella 3"] },
      { film: "Cinderella (live-action)", year: "2015" },
    ]
  },

  {
    name: "Prince Charming",
    img: PIC + "PrinceCharming1950.png",
    franchise: "Cinderella",
    keywords: ["Henry", "Kit"],
    appearances: [
      { film: "Cinderella", year: "1950" },
      { film: "Cinderella II: Dreams Come True", year: "2002", keywords: ["cinderella 2: dreams come true"] },
      { film: "Cinderella III: A Twist in Time", year: "2007", keywords: ["cinderella 3"] },
      { film: "Cinderella (live-action)", year: "2015" },
      { film: "Once Upon a Studio", year: "2023" },
    ]
  },

  // ── MODELE A DUPLIQUER POUR CHAQUE NOUVEAU PERSONNAGE ────────
  // {
  //   name: "NOM DU PERSONNAGE",
  //   img: PIC + "nomdufichierimage.png",
  //   franchise: "Nom de la saga", // ex: "Toy Story" — sert au tri/regroupement
  //   keywords: ["surnom", "autre orthographe"], // optionnel, à retirer si pas besoin
  //   link: "/characters/nomdufichier.html", // à retirer si la page n'existe pas encore
  //   appearances: [
  //     { film: "Titre du film", year: "Année" },
  //     { film: "Titre du film 2", year: "Année 2", keywords: ["autre orthographe"], upcoming: true }
  //   ]
  // },

];

// ============================================================
//  RENDERING
// ============================================================

const grid = document.getElementById('characterGrid');

function buildCharacterCard(character) {
  const li = document.createElement('li');
  li.className = 'character-card';

  const hasLink = !!character.link;
  if (!hasLink) li.classList.add('no-link');

  // Deux textes de recherche séparés : un pour le nom (+ mots-clés), un pour les films (+ leurs mots-clés)
  const keywordText = character.keywords ? ' ' + character.keywords.join(' ') : '';
  li.dataset.searchName = (character.name + keywordText).toLowerCase();
  li.dataset.searchFilms = character.appearances
    .map(a => a.film + (a.keywords ? ' ' + a.keywords.join(' ') : ''))
    .join(' ')
    .toLowerCase();

  li.innerHTML = `
    <div class="flip-inner">
      <div class="card-face card-front">
        <div class="photo-frame">
          <img class="photo-main" src="${character.img}" alt="${character.name}">
          <div class="card-caption">
            <span class="character-name">${character.name}</span>
          </div>
        </div>
        <span class="corner corner-tl"></span>
        <span class="corner corner-tr"></span>
        <span class="corner corner-bl"></span>
        <span class="corner corner-br"></span>
      </div>
      <div class="card-face card-back">
        <span class="card-back-count">${character.appearances.length} appearance${character.appearances.length > 1 ? 's' : ''}</span>
        <ul class="card-back-list">
          ${character.appearances.map(a => `
            <li>
              <span class="card-back-film">${a.film}</span>
              <span class="card-back-year">${a.year}${a.upcoming ? '<span class="upcoming-badge">Upcoming</span>' : ''}</span>
            </li>
          `).join('')}
        </ul>
        <span class="card-back-hint">${hasLink ? 'Click to view full profile' : 'Full profile coming soon'}</span>
      </div>
    </div>
  `;

  if (hasLink) {
    li.addEventListener('click', () => { window.location.href = character.link; });
  }

  setupAutoScroll(li);

  return li;
}

// Tri par franchise (regroupées entre elles, dans l'ordre chronologique de
// sortie du 1er film de la franchise), puis par année du premier film de
// CHAQUE personnage à l'intérieur de sa franchise (ex: Jessie, qui arrive
// dans Toy Story 2, reste bien rangée avec Woody et Buzz, mais après eux).
// Peu importe l'ordre dans lequel tu ajoutes les personnages ci-dessus,
// ils s'affichent toujours rangés pareil.
function firstYear(character) {
  return Math.min(...character.appearances.map(a => parseInt(a.year, 10) || Infinity));
}

// Année d'ancrage de chaque franchise = l'année la plus ancienne parmi
// tous les personnages qui lui sont rattachés
const franchiseYears = {};
characters.forEach(c => {
  const key = c.franchise || c.name;
  const y = firstYear(c);
  if (!(key in franchiseYears) || y < franchiseYears[key]) {
    franchiseYears[key] = y;
  }
});

const sortedCharacters = [...characters].sort((a, b) => {
  const keyA = a.franchise || a.name;
  const keyB = b.franchise || b.name;
  const franchiseDiff = franchiseYears[keyA] - franchiseYears[keyB];
  if (franchiseDiff !== 0) return franchiseDiff;
  return firstYear(a) - firstYear(b);
});

sortedCharacters.forEach(character => grid.appendChild(buildCharacterCard(character)));

// ============================================================
//  AUTO-SCROLL DE LA LISTE AU DOS DE LA CARTE
//  MODIFIE ICI :
//    DEAD_ZONE   : la zone centrale (en %) où la souris ne fait rien défiler.
//                  0.35 veut dire que les 35% du haut et les 35% du bas
//                  déclenchent le défilement, le milieu (30%) reste neutre.
//    MAX_SPEED   : vitesse maximale de défilement (en pixels par frame),
//                  atteinte quand la souris est tout en haut ou tout en bas.
// ============================================================

const DEAD_ZONE = 0.35;
const MAX_SPEED = 3;

function setupAutoScroll(li) {
  const backEl = li.querySelector('.card-back');
  let speed = 0;
  let rafId = null;

  function step() {
    if (speed !== 0) {
      backEl.scrollTop += speed;
    }
    rafId = requestAnimationFrame(step);
  }

  li.addEventListener('mousemove', (e) => {
    const rect = li.getBoundingClientRect();
    const relY = (e.clientY - rect.top) / rect.height; // 0 = haut, 1 = bas

    if (relY < DEAD_ZONE) {
      const intensity = (DEAD_ZONE - relY) / DEAD_ZONE; // 0 à 1
      speed = -intensity * MAX_SPEED;
    } else if (relY > 1 - DEAD_ZONE) {
      const intensity = (relY - (1 - DEAD_ZONE)) / DEAD_ZONE;
      speed = intensity * MAX_SPEED;
    } else {
      speed = 0;
    }
  });

  li.addEventListener('mouseenter', () => {
    if (!rafId) step();
  });

  li.addEventListener('mouseleave', () => {
    speed = 0;
    if (rafId) {
      cancelAnimationFrame(rafId);
      rafId = null;
    }
  });
}

// ============================================================
//  SEARCH (nom du personnage OU titre de film)
// ============================================================

const searchInput = document.getElementById('charSearch');
const resultCount = document.getElementById('resultCount');
const modeButtons = document.querySelectorAll('.mode-btn');

// Mode actif : 'name' (par défaut) ou 'film'
let searchMode = 'name';

const PLACEHOLDERS = {
  name: 'Search by character...',
  film: 'Search by film title...'
};

// Durée de l'animation de fondu/rétrécissement (doit correspondre à la
// transition définie sur .character-card dans le CSS ci-dessus)
const TRANSITION_MS = 250;

function applySearch() {
  const query = searchInput.value.toLowerCase().trim();
  let visibleCount = 0;

  document.querySelectorAll('.character-card').forEach(card => {
    const haystack = searchMode === 'film' ? card.dataset.searchFilms : card.dataset.searchName;
    const matches = haystack.includes(query);
    const isHidden = card.style.display === 'none';

    if (matches) {
      visibleCount++;

      if (isHidden) {
        // Réapparition : on la remet dans la grille (encore invisible),
        // puis on relâche l'état "hiding" au prochain frame pour que
        // la transition de fondu/agrandissement se joue.
        card.style.display = '';
        card.classList.add('hiding');
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            card.classList.remove('hiding');
          });
        });
      }
    } else if (!isHidden) {
      // Disparition : on lance l'animation, puis on retire vraiment
      // la carte de la grille une fois la transition terminée.
      card.classList.add('hiding');
      setTimeout(() => {
        if (card.classList.contains('hiding')) {
          card.style.display = 'none';
        }
      }, TRANSITION_MS);
    }
  });

  resultCount.textContent = query
    ? `${visibleCount} character${visibleCount !== 1 ? 's' : ''} found`
    : '';
}

modeButtons.forEach(btn => {
  btn.addEventListener('click', () => {
    if (btn.dataset.mode === searchMode) return;
    searchMode = btn.dataset.mode;
    modeButtons.forEach(b => b.classList.toggle('active', b === btn));
    searchInput.placeholder = PLACEHOLDERS[searchMode];
    applySearch();
  });
});

searchInput.addEventListener('keyup', applySearch);
</script>
