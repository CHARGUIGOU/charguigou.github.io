# ============================================================
# IMAGES : HÉBERGEUR ET TAILLES — le SEUL endroit à modifier
# ============================================================
# Toutes les images du site qui passent par Cloudinary sont construites ainsi :
#       base  +  réglage (preset)  +  "/"  +  nom du fichier
# Exemple :  https://res.cloudinary.com/dofvjifeo/image/upload/ + c_limit,w_160,q_auto,f_auto + / + Ariel1989.png
#
# - Pour changer la TAILLE ou le FORMAT d'un type d'image : modifie son réglage dans "presets" ci-dessous.
# - Pour changer d'HÉBERGEUR (ex : ImageKit) : change "base" et réécris les réglages dans la syntaxe du nouvel hébergeur
#   (ex ImageKit : base "https://ik.imagekit.io/TON-ID/" et réglage "tr:w-160,c-at_max"). Rien d'autre à toucher,
#   sauf les adresses écrites À LA MAIN dans une page (<img src="https://res.cloudinary.com/..."> dans le texte d'une page).
# - Un réglage vide ("") = l'image d'origine, sans transformation.
# ============================================================
base: "https://res.cloudinary.com/dofvjifeo/image/upload/"

# Bandeaux des films (pages personnages) : hébergés sur ImageKit (adresse de base + réglage "banner" ci-dessous)
banner_base: "https://ik.imagekit.io/charguigou/"

presets:
  thumb: "c_limit,w_160,q_auto,f_auto"             # petites vignettes des personnages (tableaux de cast, fiches d'artistes) : 160 px de large
  zoom: "c_limit,w_900,q_auto,f_auto"              # même image agrandie au clic (remplace "thumb" dans l'adresse)
  card: "c_limit,w_260,q_auto,f_auto"              # cartes de la page Character Voices
  banner: "tr:q-90"                                      # bandeaux des films (ImageKit) : taille d'origine, compression légère
  gallery_thumb: "w_400,h_400,c_fill,g_{pos},q_auto"   # miniatures carrées des galeries ({pos} = north / center / south, mis automatiquement)
  artist_thumb: "c_fill,g_auto,w_160,h_160,q_auto,f_auto"   # vignettes carrées de la page Voice Artists (artistes)
  studio_thumb: "c_fit,w_160,h_160,q_auto,f_auto"          # vignettes de la page Voice Artists (studios : logo entier)
  photo: "q_auto,f_auto"                           # photos des artistes (cartes de cast, fiches) : mêmes dimensions, format plus léger

# ------------------------------------------------------------
# IMAGES HÉBERGÉES SUR WEEBLY (drapeaux, images de cinéma, logos des pages Movie Cast)
# Début commun de l'adresse de ces images : si elles changent un jour d'hébergeur, c'est ici que ça se change
# (et le reste de l'adresse = le nom du fichier, écrit dans la page).
# ------------------------------------------------------------
weebly:
  disney: "https://disneyinternationaldubbings.weebly.com/uploads/5/5/8/3/55831083/"
  nondisney: "https://nondisneyinternationaldubbings.weebly.com/uploads/5/5/8/3/55831083/"

# ------------------------------------------------------------
# IMAGES DES PERSONNAGES (vignettes des casts et fiches d'artistes, zoom au clic, cartes de Character Voices)
# Même principe que le reste : base + réglage + "/" + nom du fichier. Tout est ici, rien ailleurs.
#
# POUR BASCULER SUR IMAGEKIT : (1) uploader toutes les images des personnages dans le dossier « characters » d'ImageKit (mêmes noms de fichiers, extension comprise),
# (2) remplacer les 4 lignes ci-dessous par les lignes "ImageKit" en commentaire juste en dessous.
# ------------------------------------------------------------
characters:
  base: "https://ik.imagekit.io/charguigou/"
  thumb: "tr:w-240,c-at_max/characters"
  zoom: "tr:w-900,c-at_max/characters"
  card: "tr:w-360,c-at_max/characters"
