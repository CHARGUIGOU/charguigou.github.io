# ============================================================
#  BASE DE DONNÉES DES PERSONNAGES (utilisée par Character voices, les pages de cast
#  et les fiches des artistes). Un seul endroit pour les images.
#
#  image_base : début commun des URLs d'images (Cloudinary). Dans "img", tu n'écris que
#               le nom du fichier ; si tu écris une URL complète (https://...), elle est utilisée telle quelle.
#
#  Pour chaque personnage :
#    id          : clé courte, en minuscules, basée sur le nom original simplifié (ex: nongman, elsa).
#                  C'est elle qu'on écrit dans les lignes de cast (5e champ).
#    name        : nom affiché sur la carte
#    img         : image principale (nom de fichier)
#    franchise, keywords, link : comme avant
#    hidden: true : le personnage n'apparaît PAS sur la page Character voices (mais son image sert aux casts et fiches)
#    appearances : liste des films ; "img" (facultatif) = image DE CE FILM (sert partout : Character voices par film,
#                  page de cast de ce film, fiche de l'artiste). Le film est reconnu par son titre
#                  (identique au champ "film" de la page de cast).
# ============================================================
image_base: "https://res.cloudinary.com/dofvjifeo/image/upload/c_limit,w_500,q_auto,f_auto/"

