<style>
/* MODIFIE ICI : marge latérale globale du site (touche toutes les sections) */
:root {
  --page-margin: 10%;
}

body, .film-title, .category-title, #filmSearch {
  font-family: 'Open Sans', sans-serif !important;
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

.film-list-wrapper {
  overflow-x: hidden;
  padding: 10px var(--page-margin);
  padding-bottom: 40px;
  box-sizing: border-box;
}

#filmSearch {
  width: 300px;
  padding: 8px 12px;
  font-size: 12px;
  border-radius: 10px;
  border: 1px solid #ccc;
  margin: 20px auto;
  display: block;
  box-sizing: border-box;
  transition: all 0.3s ease;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}
#filmSearch:focus {
  outline: none;
  border-color: #7da1c9;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}

.category-title {
  font-size: 20px !important;
  margin-top: 35px;
  margin-bottom: 15px;
  padding: 0 var(--page-margin);
  font-weight: 600 !important;
  display: flex;
  align-items: center;
  box-sizing: border-box;
}

.film-list {
  list-style: none;
  padding-left: 0;
  margin-top: 10px;
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 12px;
  margin-bottom: 10px;
}

.film-title {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  background: #fff;
  border-radius: 8px;
  padding: 6px;
  min-height: 200px;
  justify-content: flex-start;
  position: relative;
  overflow: hidden;
  transition: transform 0.25s ease, box-shadow 0.25s ease;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

.film-title.has-link::before {
  content: "";
  position: absolute;
  top: -50%;
  left: -150%;
  width: 300%;
  height: 200%;
  background: linear-gradient(
    60deg,
    rgba(255,255,255,0) 0%,
    rgba(255,255,255,0.18) 45%,
    rgba(255,255,255,0.25) 50%,
    rgba(255,255,255,0.18) 55%,
    rgba(255,255,255,0) 100%
  );
  transform: rotate(20deg) translateX(-150%);
  pointer-events: none;
  opacity: 0;
}

.film-title.has-link:hover::before {
  opacity: 1;
  animation: projectorSweepOnce 1.5s ease forwards;
}

@keyframes projectorSweepOnce {
  0%   { transform: rotate(20deg) translateX(-150%); }
  100% { transform: rotate(20deg) translateX(150%); }
}

.film-title.has-link:hover {
  transform: scale(1.05);
  box-shadow: 0 10px 15px rgba(0,0,0,0.25);
  cursor: pointer;
}

.film-title img {
  width: 100%;
  max-height: 120px;
  object-fit: cover;
  border-radius: 6px;
  margin-bottom: 6px;
}

.film-title .film-year {
  font-weight: bold;
  font-size: 12px;
  margin-bottom: 4px;
  color: #000;
  letter-spacing: 1px;
}
.film-title .film-name {
  font-size: 12px;
  margin: 0;
  color: #000;
}
.film-title a {
  color: #1a0dab;
  text-decoration: none;
  font-size: 12px;
  font-style: italic;
}
.film-title a:hover {
  text-decoration: none;
}

.category-title img {
  width: 34px;
  height: 34px;
  margin-right: 8px;
  vertical-align: middle;
}

.keywords {
  display: none;
}

.no-dub {
  filter: grayscale(100%) brightness(0.92);
  opacity: 0.9;
  transition: filter 0.3s ease, opacity 0.3s ease;
}

.no-dub:hover {
  filter: grayscale(80%) brightness(1);
  opacity: 1;
}

.no-dub.has-link::before {
  display: none;
}

.no-dub img {
  filter: grayscale(100%);
  opacity: 0.9;
  transition: opacity 0.3s ease;
}

.no-dub:hover img {
  opacity: 1;
}

.no-dub-badge {
  position: absolute;
  top: 10px;
  right: 10px;
  background: rgba(0,0,0,0.6);
  color: #fff;
  font-size: 10px;
  padding: 2px 6px;
  border-radius: 5px;
  pointer-events: none;
}

.no-dub-title img {
  width: 38px;
  height: 38px;
  opacity: 0.85;
}

/* Studio filter buttons */
.studio-filter {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  margin: 30px var(--page-margin) 20px;
}

.studio-btn {
  font-family: 'Open Sans', sans-serif;
  font-size: 12px;
  padding: 6px 18px;
  border-radius: 20px;
  border: 1px solid #ccc;
  background: #f5f5f5;
  color: #333;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: background 0.35s ease, color 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease;
}

.studio-btn:not(.active):hover {
  background: #e0e0e0;
}

.studio-btn.active {
  background: #1a4a8a;
  border-color: #1a4a8a;
  color: #fff;
  box-shadow: 0 3px 8px rgba(26, 74, 138, 0.35);
}

.studio-btn .count {
  font-size: 10px;
  opacity: 0.75;
  margin-left: 2px;
}

/* ============================================================
   SECTION TRIVIA (bas de page)
   ============================================================ */
.trivia-section {
  margin: 50px 0 40px;
  padding: 0 var(--page-margin);
  box-sizing: border-box;
  color: #333;
}
.trivia-title {
  font-size: 20px;
  font-weight: 600;
  color: #222;
  letter-spacing: 1px;
  margin-bottom: 12px;
  text-align: center;
}
.trivia-title .highlight {
  color: #d9534f;
}
.trivia-section ul {
  padding-left: 20px;
  margin: 0;
}
.trivia-section li {
  margin-bottom: 6px;
  font-size: 14px;
  line-height: 1.5;
}


@media (max-width: 1300px) {
  .film-list { grid-template-columns: repeat(4, 1fr); }
}
@media (max-width: 900px) {
  .film-list { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 500px) {
  .film-list { grid-template-columns: 1fr; }
}
</style>

// ============================================================
//  RENDERING
// ============================================================

function buildFilmItem(film) {
  const li = document.createElement('li');
  const isNoDub = !!film.noDub;

  li.className = 'film-title' + (isNoDub ? ' no-dub' : '');
  li.dataset.studio = film.studio || 'disney';

  // Keywords span(s)
  const kwHTML = film.keywords
    ? film.keywords.map(k => `<span class="keywords">${k}</span>`).join('')
    : '';

  // Badge
  const badgeText = film.badge || 'No Dub';
  const badgeHTML = (isNoDub || film.badge) ? `<span class="no-dub-badge">${badgeText}</span>` : '';

  // Name / link
  const nameHTML = film.link
    ? `<a href="${film.link}">${film.name}</a>`
    : `<span class="film-name">${film.name}</span>`;

  li.innerHTML = `
    <img src="${film.img}" alt="${film.name.replace(/<br>/g,' ')}">
    <span class="film-year">${film.year || film.date?.substring(0,4) || '????'}</span>
    ${nameHTML}
    ${kwHTML}
    ${badgeHTML}
  `;

  if (film.link && !isNoDub) {
    li.classList.add('has-link');
    li.addEventListener('click', () => { window.location.href = film.link; });
  }

  return li;
}

function parseDate(dateStr) {
  if (!dateStr) return new Date('9999-01-01');
  if (dateStr === '????') return new Date('0001-01-01');
  const normalized = dateStr
    .replace('20??', '1999-12-31')
    .replace('201?', '2009-12-31')
    .replace('202?', '2019-12-31')
    .replace(/\?/g, '0');
  const d = new Date(normalized);
  return isNaN(d) ? new Date('9999-01-01') : d;
}

films.sort((a, b) => parseDate(a.date || a.year) - parseDate(b.date || b.year));

// Separate dubbed and no-dub per category, then append dubbed first, no-dub into nodub list
const categoryLists = { classics: [], shorts: [], live: [] };
const noDubItems = [];

films.forEach(film => {
  if (film.noDub) {
    noDubItems.push(film);
  } else {
    categoryLists[film.category].push(film);
  }
});

['classics','shorts','live'].forEach(cat => {
  const ul = document.getElementById('list-' + cat);
  categoryLists[cat].forEach(film => ul.appendChild(buildFilmItem(film)));
});

const noDubUl = document.getElementById('list-nodub');
noDubItems.forEach(film => noDubUl.appendChild(buildFilmItem(film)));

// ============================================================
//  STUDIO FILTER + SEARCH (combined)
// ============================================================

// Track active studio filter
let activeStudio = 'all';

// Studios grouped under "others" button
const OTHERS = ['dreamworks', 'donbluth', 'richard_rich', 'warner', 'netflix', 'fox'];

function studioMatches(filmStudio, filterStudio) {
  if (filterStudio === 'all') return true;
  if (filterStudio === 'others') return OTHERS.includes(filmStudio);
  return filmStudio === filterStudio;
}

function applyFilters() {
  const search = document.getElementById('filmSearch').value.toLowerCase();

  document.querySelectorAll('.film-title').forEach(function (el) {
    const text        = el.textContent.toLowerCase();
    const filmStudio  = el.dataset.studio || 'disney';
    const matchSearch = text.includes(search);
    const matchStudio = studioMatches(filmStudio, activeStudio);
    el.style.display  = (matchSearch && matchStudio) ? 'flex' : 'none';
  });

  ['classics','shorts','live','nodub'].forEach(function (cat) {
    const title   = document.getElementById('title-'   + cat);
    const wrapper = document.getElementById('wrapper-' + cat);
    const ul      = document.getElementById('list-'    + cat);
    if (!ul) return;
    const hasVisible = [...ul.querySelectorAll('.film-title')].some(f => f.style.display !== 'none');
    title.style.display   = hasVisible ? '' : 'none';
    wrapper.style.display = hasVisible ? '' : 'none';
  });

  // Mise à jour des compteurs
  document.querySelectorAll('.studio-btn').forEach(function(btn) {
    const studio = btn.dataset.studio;
    const count = films.filter(f => !f.noDub && studioMatches(f.studio || 'disney', studio) && f.name.toLowerCase().includes(search)).length;
    btn.querySelector('.count').textContent = '(' + count + ')';
  });
}

// Studio buttons
document.querySelectorAll('.studio-btn').forEach(function (btn) {
  btn.addEventListener('click', function () {
    document.querySelectorAll('.studio-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeStudio = btn.dataset.studio;
    applyFilters();
  });
});

applyFilters(); // initialisation au chargement

// Search bar
document.getElementById('filmSearch').addEventListener('keyup', applyFilters);
</script>
