{% comment %} Galerie plein écran + scripts communs (bandeaux, onglets, galerie). Inclus en bas de chaque page. {% endcomment %}
<!-- Galerie plein écran -->
<div class="lightbox-overlay" id="lightbox" aria-hidden="true">
  <button class="lightbox-btn close" type="button" aria-label="Close">&#10005;</button>
  <button class="lightbox-btn prev" type="button" aria-label="Previous image">&#8249;</button>
  <figure class="lightbox-figure">
    <img id="lightboxImg" src="" alt="">
    <figcaption class="lightbox-caption" id="lightboxCaption"></figcaption>
  </figure>
  <button class="lightbox-btn next" type="button" aria-label="Next image">&#8250;</button>
  <div class="lightbox-counter" id="lightboxCounter"></div>
</div>

<!-- ============================================================
     POUSSIÈRE DE FÉE DES BANDEAUX (seulement les bandeaux avec class="sparkle").
     Une petite étoile traverse le bandeau en ondulant et sème des grains qui
     scintillent puis s'éteignent derrière elle. Positions, tailles et durées
     sont aléatoires (rendu organique). Réglages : :root (--banner-spark-*,
     --banner-wave-*). Si le bandeau a aussi "glow", le halo du texte s'allume
     quand la poussière passe dessus.
     ============================================================ -->
<script>
(function () {
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  if (!Element.prototype.animate) return;

  function init() {
    var css = getComputedStyle(document.documentElement);
    function num(name, fallback) { var v = parseFloat(css.getPropertyValue(name)); return isNaN(v) ? fallback : v; }
    var minSize  = num('--banner-spark-size-min', 2);
    var maxSize  = num('--banner-spark-size-max', 6);
    var spacing  = num('--banner-spark-density', 7);
    var life     = num('--banner-spark-life', 1.8);
    var period   = num('--banner-wave-duration', 7);
    var crossing = Math.min(num('--banner-wave-crossing', 3.4), period * 0.9);

    document.querySelectorAll('.cast-banner.sparkle').forEach(function (cell) {
      var inner = cell.querySelector('.banner-inner');
      var w = inner.clientWidth, h = inner.clientHeight;
      if (!w || !h) return;

      // Trajet ondulé de la "tête" : u va de 0 (gauche) à 1 (droite)
      var ph1 = Math.random() * 6.28, ph2 = Math.random() * 6.28;
      var waves = Math.max(2, w / 260);
      function pos(u) {
        var x = (-0.04 + 1.08 * u) * w;
        var y = h / 2 + h * 0.26 * (0.65 * Math.sin(u * waves * 6.28 + ph1) + 0.35 * Math.sin(u * waves * 15.7 + ph2));
        return { x: x, y: y };
      }
      function T(x, y, scale) { return 'translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px) scale(' + scale + ')'; }

      var layer = document.createElement('div');
      layer.className = 'banner-sparkles';
      var cyc = crossing / period;   // part du cycle pendant laquelle la poussière avance

      // La tête brillante
      var headSize = maxSize + 3;
      var head = document.createElement('span');
      head.className = 'banner-dust head';
      head.style.width = head.style.height = headSize + 'px';
      var hk = [], steps = 48;
      for (var k = 0; k <= steps; k++) {
        var u = k / steps, p = pos(u);
        hk.push({ offset: u * cyc, opacity: (u < 0.04 || u > 0.96) ? 0 : 1,
                  transform: T(p.x - headSize / 2, p.y - headSize / 2, 1) });
      }
      hk.push({ offset: 1, opacity: 0, transform: hk[hk.length - 1].transform });
      layer.appendChild(head);
      head.animate(hk, { duration: period * 1000, iterations: Infinity, easing: 'linear' });

      // Les grains semés derrière la tête
      var count = Math.max(20, Math.round(w / spacing));
      for (var i = 0; i < count; i++) {
        var uu = Math.min(1, Math.max(0, (i + Math.random()) / count));
        var p = pos(uu);
        var size = minSize + Math.pow(Math.random(), 1.8) * (maxSize - minSize);   // surtout des petits, quelques gros
        var x = p.x - size / 2 + (Math.random() - 0.5) * 6;
        var y = p.y - size / 2 + (Math.random() - 0.5) * h * 0.28;
        var dx = -Math.random() * 12;            // les grains restent un peu en arrière
        var dy = 4 + Math.random() * 16;         // et retombent doucement
        var L = life * (0.55 + Math.random() * 0.9);
        var f = Math.min(0.95, L / period);

        var d = document.createElement('span');
        d.className = 'banner-dust';
        d.style.width = d.style.height = size + 'px';
        layer.appendChild(d);
        d.animate([
          { offset: 0,        opacity: 0,    transform: T(x, y, 0.3) },
          { offset: f * 0.10, opacity: 1,    transform: T(x + dx * 0.15, y + dy * 0.15, 1) },
          { offset: f * 0.30, opacity: 0.45, transform: T(x + dx * 0.4,  y + dy * 0.4,  0.85) },   // petit scintillement
          { offset: f * 0.45, opacity: 0.95, transform: T(x + dx * 0.55, y + dy * 0.55, 1) },
          { offset: f,        opacity: 0,    transform: T(x + dx,        y + dy,        0.2) },
          { offset: 1,        opacity: 0,    transform: T(x + dx,        y + dy,        0.2) }
        ], { duration: period * 1000, delay: uu * crossing * 1000, iterations: Infinity, easing: 'ease-out' });
      }
      inner.insertBefore(layer, inner.firstChild);

    });
  }

  function initGlow() {
    var css = getComputedStyle(document.documentElement);
    function num(name, fallback) { var v = parseFloat(css.getPropertyValue(name)); return isNaN(v) ? fallback : v; }
    var period   = num('--banner-wave-duration', 7);
    var crossing = Math.min(num('--banner-wave-crossing', 3.4), period * 0.9);
    var size     = num('--banner-glow-size', 18);

    document.querySelectorAll('.cast-banner.glow').forEach(function (cell) {
      var inner = cell.querySelector('.banner-inner');
      var text = cell.querySelector('.banner-text');
      if (!inner || !text || !text.firstChild) return;
      var r = document.createRange();
      r.selectNodeContents(text);
      var rect = r.getBoundingClientRect(), box = inner.getBoundingClientRect();
      var pad = size * 2.2;
      var glow = document.createElement('div');
      glow.className = 'banner-glow';
      glow.style.left   = (rect.left - box.left - pad) + 'px';
      glow.style.top    = (rect.top  - box.top  - pad * 0.6) + 'px';
      glow.style.width  = (rect.width  + pad * 2) + 'px';
      glow.style.height = (rect.height + pad * 1.2) + 'px';
      // Avec "sparkle" : le pic de la lueur (à 50 % du cycle) tombe quand la poussière passe sur le texte
      if (cell.classList.contains('sparkle')) {
        var frac = ((rect.left + rect.width / 2) - box.left) / box.width;
        var uText = Math.min(1, Math.max(0, (frac + 0.04) / 1.08));
        glow.style.animationDelay = (uText * crossing - period * 0.5) + 's';
      }
      inner.insertBefore(glow, inner.firstChild);
    });
  }

  function start() { init(); initGlow(); }
  if (document.readyState === 'complete') start();
  else window.addEventListener('load', start);
})();
</script>

<script>
(function () {
  /* ----- Onglets (versions) ----- */
  var tabs = document.querySelectorAll('.version-tab');
  var groups = document.querySelectorAll('.version-panel, .version-sources');
  function showVersion(v, updateHash) {
    var found = false;
    tabs.forEach(function (t) { var on = t.dataset.version === v; t.classList.toggle('active', on); if (on) found = true; });
    if (!found) return;
    groups.forEach(function (g) { g.classList.toggle('active', g.dataset.version === v); });
    if (updateHash) { try { history.replaceState(null, '', '#version-' + v); } catch (e) {} }
  }
  tabs.forEach(function (t) {
    t.addEventListener('click', function () { showVersion(t.dataset.version, true); });
  });
  /* Ouvre le bon onglet si l'adresse contient #version-xxx ou l'id d'un encadré (ex : #cast-v2) */
  function openFromHash() {
    var h = location.hash;
    if (h.indexOf('#version-') === 0) { showVersion(h.slice(9), false); return; }
    if (h.length > 1) {
      var el = document.getElementById(decodeURIComponent(h.slice(1)));
      var panel = el && el.closest('.version-panel');
      if (panel && !panel.classList.contains('active')) {
        showVersion(panel.dataset.version, false);
        el.scrollIntoView();
      }
    }
  }
  openFromHash();
  window.addEventListener('hashchange', openFromHash);
})();
(function () {
  var track    = document.getElementById('galleryTrack');
  if (!track) return;   // page sans galerie : rien à faire
  var arrows   = document.querySelectorAll('.gallery-arrow');
  var prevBtn  = document.querySelector('.gallery-arrow.prev');
  var nextBtn  = document.querySelector('.gallery-arrow.next');
  var images   = Array.prototype.slice.call(track.querySelectorAll('img'));

  /* ----- Entoure chaque miniature d'un .gallery-item (+ voile de légende si data-caption) ----- */
  var items = images.map(function (img) {
    var item = document.createElement('div');
    item.className = 'gallery-item';
    img.parentNode.insertBefore(item, img);
    item.appendChild(img);
    var text = img.getAttribute('data-caption');
    if (text) {
      var cap = document.createElement('div');
      cap.className = 'gallery-caption';
      cap.textContent = text;
      item.appendChild(cap);
    }
    return item;
  });

  /* ----- Flèches de défilement des miniatures ----- */
  function updateArrows() {
    var maxScroll = track.scrollWidth - track.clientWidth;
    prevBtn.classList.toggle('visible', track.scrollLeft > 4);
    nextBtn.classList.toggle('visible', track.scrollLeft < maxScroll - 4);
    track.parentNode.classList.toggle('fade-left', track.scrollLeft > 4);
    track.parentNode.classList.toggle('fade-right', track.scrollLeft < maxScroll - 4);
  }
  prevBtn.addEventListener('click', function () {
    track.scrollBy({ left: -track.clientWidth * 0.8 });
  });
  nextBtn.addEventListener('click', function () {
    track.scrollBy({ left: track.clientWidth * 0.8 });
  });
  track.addEventListener('scroll', updateArrows);
  window.addEventListener('resize', updateArrows);
  window.addEventListener('load', updateArrows);
  updateArrows();

  /* ----- Galerie plein écran ----- */
  var box     = document.getElementById('lightbox');
  var bigImg  = document.getElementById('lightboxImg');
  var counter = document.getElementById('lightboxCounter');
  var lbCaption = document.getElementById('lightboxCaption');
  var current = 0;

  function show(index) {
    current = (index + images.length) % images.length;   // boucle : après la dernière, retour à la première
    var img = images[current];
    bigImg.src = img.getAttribute('data-full') || img.src;   // version grande (data-full) si elle existe, sinon la miniature
    bigImg.alt = img.alt;
    lbCaption.textContent = img.getAttribute('data-caption') || '';
    counter.textContent = (current + 1) + ' / ' + images.length;
  }
  function open(index) {
    show(index);
    box.classList.add('open');
    box.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
    var single = images.length < 2;
    box.querySelector('.prev').style.display = single ? 'none' : '';
    box.querySelector('.next').style.display = single ? 'none' : '';
  }
  function close() {
    box.classList.remove('open');
    box.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
  }

  items.forEach(function (item, i) {
    item.addEventListener('click', function () { open(i); });
  });
  box.querySelector('.prev').addEventListener('click', function (e) { e.stopPropagation(); show(current - 1); });
  box.querySelector('.next').addEventListener('click', function (e) { e.stopPropagation(); show(current + 1); });
  box.querySelector('.close').addEventListener('click', close);

  // Clic en dehors de l'image (fond sombre, légende...) = fermer
  box.addEventListener('click', function (e) {
    if (e.target !== bigImg) close();
  });

  // Clavier : ← → pour naviguer, Échap pour fermer
  document.addEventListener('keydown', function (e) {
    if (!box.classList.contains('open')) return;
    if (e.key === 'Escape')     close();
    if (e.key === 'ArrowLeft')  show(current - 1);
    if (e.key === 'ArrowRight') show(current + 1);
  });
})();
</script>

<!-- ============================================================
     IMAGES DE SECOURS : si une photo de comédien ou une miniature de galerie
     ne se charge pas (lien cassé), un cadre gris avec une icône discrète
     s'affiche à la place, au même format. Dans la galerie plein écran, si
     la grande image (data-full) est cassée, la miniature est utilisée à sa place.
     ============================================================ -->
<script>
(function () {
  function svg(inner) {
    return 'data:image/svg+xml;utf8,' + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200"><rect width="300" height="200" fill="#ececec"/>' + inner + '</svg>');
  }
  var PERSON  = svg('<circle cx="150" cy="82" r="30" fill="#c9c9c9"/><path d="M90 178c0-34 27-52 60-52s60 18 60 52z" fill="#c9c9c9"/>');
  var PICTURE = svg('<rect x="95" y="62" width="110" height="76" rx="6" fill="none" stroke="#c9c9c9" stroke-width="8"/><circle cx="127" cy="88" r="9" fill="#c9c9c9"/><path d="M100 132l32-30 22 20 16-14 30 24z" fill="#c9c9c9"/>');

  function fix(img) {
    if (img.getAttribute('data-broken')) return;
    var fb = img.closest('.voice-card') ? PERSON : (img.closest('.gallery-track') ? PICTURE : null);
    if (!fb) return;
    img.setAttribute('data-broken', '1');
    img.src = fb;
  }
  // 'error' ne remonte pas dans la page : on l'écoute en phase de capture
  document.addEventListener('error', function (e) {
    if (e.target && e.target.tagName === 'IMG') fix(e.target);
  }, true);
  // images déjà en échec avant que ce script s'exécute
  function scan() {
    Array.prototype.forEach.call(document.querySelectorAll('.voice-card img, .gallery-track img'), function (img) {
      if (img.complete && img.naturalWidth === 0 && img.getAttribute('src')) fix(img);
    });
  }
  scan();
  window.addEventListener('load', scan);

  // Galerie plein écran : grande image cassée -> miniature, sinon cadre gris
  var big = document.getElementById('lightboxImg');
  if (big) big.addEventListener('error', function () {
    if (big.src === PICTURE) return;
    var thumb = null;
    Array.prototype.forEach.call(document.querySelectorAll('.gallery-track img'), function (img) {
      var full = img.getAttribute('data-full');
      if (full && new URL(full, location.href).href === big.src) thumb = img;
    });
    var s = thumb && !thumb.getAttribute('data-broken') ? thumb.src : PICTURE;
    if (s === big.src) s = PICTURE;
    big.src = s;
  });
})();
</script>
