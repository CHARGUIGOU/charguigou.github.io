{% comment %} CSS commun des pages de cast (inclus dans chaque page par la ligne include cast-style.html). {% endcomment %}
<style>
/* ============================================================
   CSS COMMUN À TOUTES LES PAGES DE CAST (fichier _includes/cast-style.html)
   Une modification faite ICI s'applique à TOUTES les pages.
   Les valeurs ci-dessous sont les valeurs PAR DÉFAUT. Pour changer un réglage
   sur UNE seule page (police du titre, taille des chansons, couleur d'un
   bandeau...), ne touche pas à ce fichier : ajoute la variable dans le petit
   bloc <style> :root { ... } de la page, juste sous l'include.
   ============================================================ */
:root {

  /* ---------- GÉNÉRAL ---------- */
  --cast-font: 'Open Sans', 'Noto Sans', sans-serif; /* 'Noto Sans' = secours pour le latin, cyrillique, grec, hindi... (les autres écritures ont leur propre police, voir plus bas) */
  --cast-max-width: 960px;        /* largeur max du contenu (les marges sur grand écran = ce qui reste de chaque côté) */
  --cast-side-padding: 10px;      /* marge gauche/droite de la page */
  --cast-accent: #2a5da0;         /* bleu du site (titre, liens) */
  --cast-text-color: #333;        /* couleur du texte courant */
  --cast-text-size: 13px;         /* taille du texte courant (tableaux, chansons, trivia...) */
  --cast-heading-color: #222;     /* couleur des titres de boîtes et en-têtes de tableaux */
  --cast-text-letter-spacing: 0px; /* espace entre les lettres du texte courant (tableaux, chansons, trivia...) */

  /* ---------- TITRE DU FILM (titre localisé + année) ---------- */
  --title-native-font: var(--cast-font);   /* police du titre localisé (voir la liste en haut du fichier pour les écritures non latines) */
  --title-native-size: 24px;
  --title-native-color: var(--cast-accent);
  --title-native-weight: 700;
  --title-year-gap: 7px;          /* espace entre le titre et l'année */
  --title-year-font: var(--cast-font);   /* police de l'année : reste celle du site même si le titre a une autre police (mets var(--title-native-font) pour la même que le titre) */
  --title-year-size: 24px;        /* taille de l'année (indépendante du titre : utile quand le titre est en hindi, arabe, etc. dont les lettres paraissent plus petites) */
  --title-year-weight: 700;
  --title-year-color: var(--title-native-color);
  --title-native-letter-spacing: 0px;   /* espace entre les lettres du titre localisé (à laisser à 0 pour hindi, arabe... : l'écriture est reliée) */
  --title-year-letter-spacing: 0px;

  /* ---------- TITRE ANGLAIS (sous le titre localisé) ---------- */
  --title-english-size: 15px;
  --title-english-color: var(--cast-text-color);
  --title-english-style: italic;  /* italic ou normal */
  --title-english-weight: 600;    /* 400 = normal, 700 = gras */
  --title-english-space-above: 6px;
  --title-english-space-below: 30px;
  --title-english-letter-spacing: 1px;

  /* ---------- TRAITS HORIZONTAUX ---------- */
  --hr-width: 70%;                /* largeur du trait (par rapport à la page) */
  --hr-color: #ddd;
  --hr-thickness: 1px;
  --hr-space-above: 0px;          /* espace au-dessus du trait */
  --hr-space-below: 40px;         /* espace en dessous du trait */

  /* ---------- ONGLETS (versions / doublages multiples) ---------- */
  --tab-align: flex-start;        /* position des onglets : flex-start (gauche), center, flex-end (droite) */
  --tab-gap: 0px;                 /* espace entre les onglets */
  --tab-pad-y: 16px;
  --tab-pad-x: 36px;
  --tab-size: 14px;
  --tab-weight: 700;
  --tab-letter-spacing: 0px;
  --tab-text-color: #000;
  --tab-bg: #f5f5f5;              /* fond des onglets inactifs */
  --tab-bg-hover: #ececec;        /* fond au survol */
  --tab-active-bg: transparent;   /* fond de l'onglet actif */
  --tab-underline-color: #000;    /* trait sous l'onglet actif */
  --tab-underline-thickness: 1px;
  --tab-space-below: 30px;        /* espace entre les onglets et le contenu */
  --tab-fade-duration: 0.25s;     /* fondu quand on change d'onglet (0s = instantané) */

  /* ---------- PHOTOS DES COMÉDIENS ---------- */
  --voice-gap: 20px;              /* espace entre les photos */
  --voice-card-min: 200px;        /* largeur mini d'une carte avant de passer à la ligne */
  --voice-card-max: 300px;        /* largeur maxi d'une carte (mets 100% pour tout remplir) */
  --voice-photo-ratio: 3 / 2;     /* forme de la photo (ici celle de ton image test) : 1 / 1 carré, 4 / 3, 3 / 4 portrait... */
  --voice-photo-radius: 6px;
  --voice-photo-border: 1px solid var(--cast-text-color);   /* fine bordure autour des photos (mets none pour l'enlever) */
  --voice-space-below: 50px;      /* espace entre les photos et la 1re boîte */
  /* effet au survol des photos */
  --voice-hover-shadow: 0 4px 10px rgba(0,0,0,0.10);  /* ombre au survol */
  --voice-hover-duration: 0.2s;  /* vitesse de l'ombre */
  --actor-name-gap: 14px;         /* espace entre la photo et le nom */
  --actor-name-size: 21px;
  --actor-name-color: var(--actor-dates-color);
  --actor-dates-gap: 5px;         /* espace entre le nom de l'acteur et ses dates */
  --actor-dates-size: 13px;
  --actor-dates-color: #444;
  --actor-name-letter-spacing: 1px;     /* espace entre les lettres des noms sous les photos */
  --actor-dates-letter-spacing: 0px;

  /* ---------- BOÎTES GRISES (Cast, Songs, Technical Staff...) ---------- */
  --box-rgb: 0, 0, 0;             /* couleur du fond en R, G, B (0,0,0 = noir) */
  --box-opacity: 0.016;           /* OPACITÉ du fond : 0 = invisible, 0.05 = gris léger, 0.1 = plus marqué */
  --box-radius: 10px;
  --box-pad-y: 22px;              /* espace intérieur haut/bas */
  --box-pad-x: 20px;              /* espace intérieur gauche/droite */
  --box-space-below: 40px;        /* espace entre deux boîtes */
  --box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  /* effet "verre poli" (mets --glass-gloss: 0 et --glass-edge: none pour le désactiver) */
  --glass-gloss: 1;               /* intensité du reflet blanc en diagonale (0 = aucun, 1 = blanc pur dans le coin) */
  --glass-gloss-size: 55%;        /* jusqu'où le reflet s'étend (haut-gauche vers bas-droite) */
  --glass-tint-top: 1;            /* teinte du gris en haut à gauche (multiplie --box-opacity) */
  --glass-tint-bottom: 1;         /* teinte du gris en bas à droite (multiplie --box-opacity) : 1 = même gris partout, plus grand = plus de contraste avec le reflet */
  --glass-border: 1px solid rgba(0,0,0,0.07);   /* fin liseré extérieur */
  /* Double trait sur les bords HAUT et DROIT (la lumière vient du haut-gauche), qui suit l'arrondi des coins :
     un liseré clair, puis un filet gris plus fin juste en dessous. Il disparaît en fondu en descendant le long du bord droit.
     Pour le désactiver : --glass-edge-light: transparent et --glass-edge-dark: transparent. */
  --glass-edge-light: rgba(255,255,255,0.95);   /* liseré clair */
  --glass-edge-dark: rgba(0,0,0,0.035);         /* filet gris sous le liseré */
  --glass-edge-hold: 20px;        /* hauteur sur laquelle le trait reste net en haut du bord droit */
  --glass-edge-fade: 110px;       /* hauteur à laquelle il a complètement disparu (plus petit = disparaît plus vite) */
  --glass-edge-top-start: 40%;    /* le trait du haut est invisible jusqu'ici (en % de la largeur, depuis la gauche) */
  --glass-edge-top-full: 95%;     /* ...puis apparaît progressivement et est net à partir d'ici (vers le coin haut-droit) */

  /* ---------- TITRES DES BOÎTES (Cast, Songs... + Gallery) ---------- */
  --box-title-size: 17px;
  --box-title-color: var(--cast-heading-color);
  --box-title-weight: 700;
  --box-title-space-below: 16px;
  --box-title-letter-spacing: 0px;      /* aussi appliqué au titre "Gallery" */

  /* ---------- TABLEAUX (Cast, Technical Staff) ---------- */
  --table-head-size: 12px;
  --table-head-letter-spacing: 0px;
  --table-row-border: #e3e3e3;    /* trait entre les lignes du tableau Cast */
  --table-cell-pad-x: 10px;       /* espace intérieur gauche/droite de chaque cellule : l'écart entre deux colonnes = 2 x cette valeur */
  --cast-names-wrap: nowrap;      /* colonnes 1 et 2 : nowrap = aussi larges que leur plus long nom (la colonne Voices prend le reste) ; normal = elles peuvent passer à la ligne */
  --cast-native-name-font: var(--title-native-font);   /* police de la colonne des noms natifs du tableau Cast (par défaut : celle du titre du film) */
  --cast-native-name-scale: 1;    /* taille des noms natifs : multiple du texte courant (1 = normal ; 1.2 = +20%) */

  /* ---------- BANDEAUX DE CATÉGORIE (dans le tableau Cast : "Disney Princesses", "Movie characters"...) ---------- */
  --banner-bg: #e8f1fb;           /* couleur de fond par défaut des bandeaux (modifiable bandeau par bandeau, voir l'exemple en bas du tableau) */
  --banner-height: 70px;          /* hauteur de TOUS les bandeaux (l'image prend toute la largeur ; si elle est trop haute, elle est rognée en haut et en bas, jamais déformée) */
  --banner-img-position: left center;  /* partie de l'image gardée quand elle est rognée : left center, center, right center, top, bottom... */
  --banner-text-offset: 50px;    /* décale le texte vers la droite (pour dégager le logo à gauche de l'image) ; 0px = collé à gauche */
  --banner-justify: flex-start;   /* position du texte sur l'image : flex-start = à gauche, center = centré, flex-end = à droite */
  --banner-text-font: 'Cinzel', var(--cast-font), serif;   /* police du texte des bandeaux (mets var(--cast-font) pour revenir à celle du site) */
  --banner-text-size: 20px;       /* ajuste selon la police (les polices décoratives paraissent plus grandes ou plus petites que celle du site) */
  --banner-text-letter-spacing: 2px;   /* espace entre les lettres du texte des bandeaux */
  --banner-text-weight: 600;      /* Cinzel est variable : de 400 (normal) à 900 (très gras) */
  --banner-text-color: #fff;      /* couleur du texte */
  --banner-text-shadow: 0 1px 6px rgba(0,0,0,0.85);   /* ombre noire douce (pour l'enlever : 0 0 0 transparent) */
  /* Effets animés (classes "sparkle" et "glow" à ajouter sur le <td class="cast-banner">) */
  --banner-sparkle-color: 255,255,255;   /* couleur de la poussière de fée, en R,G,B */
  --banner-spark-size-min: 2px;          /* taille des plus petits grains */
  --banner-spark-size-max: 6px;          /* taille des plus gros grains */
  --banner-spark-density: 7px;           /* 1 grain tous les ~7px de trajet (plus petit = traînée plus fournie) */
  --banner-spark-life: 1.8s;             /* durée de vie d'un grain = longueur de la traînée derrière la tête (plus grand = traînée plus longue) */
  --banner-wave-duration: 7s;            /* durée d'un cycle complet (traversée + pause) */
  --banner-wave-crossing: 3.4s;          /* temps que met la poussière pour traverser le bandeau (le reste du cycle = pause) */
  --banner-glow-color: 190,215,248;      /* couleur de la lueur derrière le texte, en R,G,B (un bleu doux : du blanc ne se verrait pas sur un fond aussi clair) */
  --banner-dust-halo: 120,170,240;       /* couleur du petit halo autour des grains de poussière, en R,G,B */
  --banner-glow-size: 18px;              /* de combien la lueur dépasse autour du texte */
  --banner-glow-strength: 0.9;           /* intensité de la lueur au plus fort (0 à 1) */

  --staff-table-max-width: 100%;   /* largeur max du tableau Technical Staff (100% = toute la boîte, évite que les noms longs passent à la ligne ; mets 420px pour le resserrer au centre) */

  /* ---------- LISTES À 2 COLONNES (Additional voices / Choir) ---------- */
  --voices-column-gap: 24px;      /* espace central entre colonne gauche et droite */
  --voices-row-gap: 8px;
  --voices-subtitle-size: 14px;          /* taille d'un sous-titre placé entre deux listes (class="voices-subtitle") */
  --voices-subtitle-space-above: 28px;  /* espace entre la liste du dessus et le sous-titre */
  --voices-subtitle-space-below: 16px;  /* espace entre le sous-titre et la liste du dessous */

  /* ---------- CHANSONS ---------- */
  --song-space-between: 18px;     /* espace entre deux chansons */
  --song-line-height: 1.5;
  --song-native-size: 1em;   /* taille des titres natifs des chansons (1em = taille normale du texte ; 1.15em = +15%) */
  --song-native-font: var(--title-native-font);       /* police des titres natifs des chansons (par défaut : la même que le titre du film) */
  --song-native-weight: var(--title-native-weight);   /* graisse des titres natifs des chansons (par défaut : la même que le titre du film) */

  /* ---------- LIENS (quand tu en ajoutes) ---------- */
  --link-color: var(--cast-accent);

  /* ---------- TRIVIA ---------- */
  --trivia-space-above: 40px;
  --trivia-line-height: 1.6;

  /* ---------- GALERIE ---------- */
  --gallery-gap: 12px;            /* espace entre les miniatures */
  --gallery-fade-width: 60px;     /* largeur du fondu blanc sur les bords quand il reste des images à faire défiler (0px = pas de fondu) */
  --gallery-thumb-size: 200px;    /* côté des miniatures carrées */
  --gallery-photo-radius: 6px;
  --gallery-space-above: 50px;    /* espace au-dessus du titre "Gallery" */
  --gallery-veil: rgba(42,93,160,0.6);         /* voile sur la miniature au survol (bleu du site, 42,93,160 ; change le dernier chiffre pour l'opacité) */
  --gallery-caption-size: 13px;                /* taille de la légende sur la miniature */
  --lightbox-caption-size: 15px;               /* taille de la légende sous l'image ouverte */
  --gallery-arrow-bg: rgba(255,255,255,0.95);  /* flèches de défilement des miniatures */
  --gallery-arrow-color: var(--cast-accent);
  --gallery-arrow-size: 38px;
  --lightbox-bg: rgba(0,0,0,0.88);             /* fond de la galerie plein écran */

  /* ---------- LIENS VERS LES PAGES SIMILAIRES (bas de page) ----------
     À gauche : films précédents (flèche à gauche). À droite : films suivants (flèche à droite). */
  --related-size: 14px;
  --related-color: #9a3b3b;
  --related-style: italic;
  --related-space-above: 40px;
  --related-line-space: 6px;      /* espace entre deux liens empilés */
  --related-letter-spacing: 0px;
  --related-arrow-gap: 6px;       /* espace entre la flèche et le texte */

  /* ---------- SOURCES + CONTACT (bas de page) ---------- */
  --sources-size: 12px;           /* un cran en dessous du texte courant (--cast-text-size) */
  --sources-color: var(--cast-text-color);
  --sources-style: italic;
  --sources-line-height: 1.7;
  --sources-letter-spacing: 0px;
  --sources-space-above: 40px;
}

/* LIENS : pas de soulignage par défaut, seulement au survol. Limité au contenu de la
   page (.cast-wrap) pour ne pas toucher au menu du header, qui a son propre soulignement. */
.cast-wrap a {
  text-decoration: none;
}
.cast-wrap a:hover {
  text-decoration: underline;
}

body {
  font-family: var(--cast-font) !important;
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

.cast-wrap {
  max-width: var(--cast-max-width);
  margin: 0 auto 100px;
  padding: 60px var(--cast-side-padding) 0;
  box-sizing: border-box;
  color: var(--cast-text-color);
  letter-spacing: var(--cast-text-letter-spacing);   /* hérité par tout le texte, sauf éléments qui ont leur propre réglage */
}

/* ============================================================
   TITRE DU FILM
   ============================================================ */
.cast-title-native {
  text-align: center;
  font-family: var(--title-native-font);
  font-size: var(--title-native-size);
  font-weight: var(--title-native-weight);
  color: var(--title-native-color);
  letter-spacing: var(--title-native-letter-spacing);
}
.cast-title-native .native-year {
  font-family: var(--title-year-font);
  margin-left: var(--title-year-gap);
  font-size: var(--title-year-size);
  font-weight: var(--title-year-weight);
  color: var(--title-year-color);
  letter-spacing: var(--title-year-letter-spacing);
}
.cast-title-english {
  text-align: center;
  font-size: var(--title-english-size);
  font-style: var(--title-english-style);
  font-weight: var(--title-english-weight);
  color: var(--title-english-color);
  letter-spacing: var(--title-english-letter-spacing);
  margin-top: var(--title-english-space-above);
  margin-bottom: var(--title-english-space-below);
}

/* Trait horizontal (utilisé 2 fois : sous le titre, et avant la trivia) */
.cast-hr {
  border: none;
  border-top: var(--hr-thickness) solid var(--hr-color);
  width: var(--hr-width);
  margin: var(--hr-space-above) auto var(--hr-space-below);
}

/* ============================================================
   PHOTOS DES COMÉDIENS — elles se partagent toute la largeur
   disponible (jusqu'à --voice-card-max chacune) et passent à la
   ligne toutes seules s'il y en a beaucoup.
   ============================================================ */
.voice-cast {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: var(--voice-gap);
  margin-bottom: var(--voice-space-below);
}
.voice-card {
  flex: 1 1 var(--voice-card-min);
  max-width: var(--voice-card-max);
  text-align: center;
}
.voice-card img {
  width: 100%;
  aspect-ratio: var(--voice-photo-ratio);
  object-fit: cover;
  display: block;
  border-radius: var(--voice-photo-radius);
  border: var(--voice-photo-border);
  box-sizing: border-box;
  transition: box-shadow var(--voice-hover-duration) ease-in-out;
}
.voice-card img:hover {
  box-shadow: var(--voice-hover-shadow);
}
.voice-card .actor-name {
  margin-top: var(--actor-name-gap);
  font-size: var(--actor-name-size);
  color: var(--actor-name-color);
  letter-spacing: var(--actor-name-letter-spacing);
}
.voice-card .actor-dates {
  margin-top: var(--actor-dates-gap);
  font-size: var(--actor-dates-size);
  font-style: normal;
  color: var(--actor-dates-color);
  letter-spacing: var(--actor-dates-letter-spacing);
}

/* ============================================================
   BOÎTES GRISES (Cast / Additional voices / Choir / Songs /
   Technical Staff) — même style pour toutes.
   ============================================================ */
.info-box {
  position: relative;
  background: linear-gradient(135deg,
    rgba(var(--box-rgb), calc(var(--box-opacity) * var(--glass-tint-top))) 0%,
    rgba(var(--box-rgb), calc(var(--box-opacity) * var(--glass-tint-bottom))) 100%);
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);   /* flou de ce qui est derrière (visible seulement si la page a un fond image) */
  border: var(--glass-border);
  border-radius: var(--box-radius);
  padding: var(--box-pad-y) var(--box-pad-x);
  margin-bottom: var(--box-space-below);
  box-shadow: var(--box-shadow);
  scroll-margin-top: 20px; /* marge d'arrivée quand on remonte via une flèche ↑ des sources */
}

/* Reflet de verre : bande blanche douce en diagonale depuis le coin haut-gauche */
.info-box::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: linear-gradient(115deg, rgba(255,255,255,var(--glass-gloss)) 0%, rgba(255,255,255,0) var(--glass-gloss-size));
  pointer-events: none;
}
/* Double trait haut + droite, en fondu vers le bas */
.info-box::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  border-style: solid;
  border-color: var(--glass-edge-light);
  border-width: 1px 1px 0 0;
  box-shadow: inset -1px 1px 0 var(--glass-edge-dark);
  /* deux fondus combinés : le trait du haut apparaît de gauche à droite, et le bord droit disparaît vers le bas */
  -webkit-mask-image:
    linear-gradient(to right, transparent var(--glass-edge-top-start), #000 var(--glass-edge-top-full)),
    linear-gradient(to bottom, #000 0, #000 var(--glass-edge-hold), transparent var(--glass-edge-fade));
  -webkit-mask-composite: source-in;
  mask-image:
    linear-gradient(to right, transparent var(--glass-edge-top-start), #000 var(--glass-edge-top-full)),
    linear-gradient(to bottom, #000 0, #000 var(--glass-edge-hold), transparent var(--glass-edge-fade));
  mask-composite: intersect;
  pointer-events: none;
}
.info-box > * {
  position: relative;   /* garde le contenu au-dessus du reflet */
}

/* Titre des boîtes ET titre "Gallery" : même style, même alignement
   (le titre Gallery reprend le même retrait que le texte des boîtes). */
.info-box-title,
.gallery-title,
.sources-title {
  font-size: var(--box-title-size);
  font-weight: var(--box-title-weight);
  color: var(--box-title-color);
  letter-spacing: var(--box-title-letter-spacing);
  text-align: left;
}
.info-box-title {
  margin-bottom: var(--box-title-space-below);
}
.gallery-title {
  padding-left: var(--box-pad-x);
  margin: var(--gallery-space-above) 0 var(--box-title-space-below);
}

.sources-title {
  padding-left: var(--box-pad-x);
  margin: var(--sources-space-above) 0 var(--box-title-space-below);
}

/* --- Tableau "Cast" --- */
.cast-table {
  width: 100%;
  border-collapse: collapse;
}
.cast-table th {
  text-align: center;
  font-size: var(--table-head-size);
  font-weight: 700;
  color: var(--cast-heading-color);
  letter-spacing: var(--table-head-letter-spacing);
  padding: 6px var(--table-cell-pad-x) 10px;
}
.cast-table td {
  font-size: var(--cast-text-size);
  color: var(--cast-text-color);
  padding: 10px var(--table-cell-pad-x);
  border-top: 1px solid var(--table-row-border);
  text-align: center;
  line-height: 1.36;   /* hauteur de ligne FIXE (= celle d'Open Sans) : les polices natives très hautes (Amiri, etc.) n'agrandissent plus les lignes */
}
/* Colonne 1 (noms natifs) : police réglable par page (--cast-native-name-font) et taille réglable
   (--cast-native-name-scale, un multiple du texte courant). Les cellules seules sur leur ligne
   (voix d'un rowspan) sont ignorées. */
.cast-table td:first-child:not(:only-child) {
  font-family: var(--cast-native-name-font);
  font-size: calc(var(--cast-text-size) * var(--cast-native-name-scale));
}
/* Colonnes 1 et 2 (noms du personnage) : aussi larges que leur plus long contenu,
   la colonne "Voices" prend tout le reste. (Les cellules seules sur leur ligne,
   ex : voix supplémentaires d'un rowspan, sont ignorées.) */
.cast-table th:nth-child(-n+2),
.cast-table td:nth-child(-n+2):not(:only-child) {
  width: 1%;
