{% comment %} CSS commun des pages de langue (inclus dans chaque page par la ligne include lang-style.html). {% endcomment %}
<style>
/* ============================================================
   CSS COMMUN À TOUTES LES PAGES DE LANGUE (fichier _includes/lang-style.html)
   Une modification faite ICI s'applique à TOUTES les pages de langue.
   Les valeurs ci-dessous sont les valeurs PAR DÉFAUT. Pour changer un réglage
   sur UNE seule page (police ou taille du nom natif, drapeau...), ne touche pas
   à ce fichier : ajoute la variable dans le petit bloc <style> :root { ... }
   de la page, juste sous l'include.
   ============================================================ */
:root {
  --page-margin: 10%;   /* marge latérale globale de la page (touche toutes les sections) */

  /* ---------- NOM NATIF DE LA LANGUE (sous le titre de la page) ---------- */
  --title-native-font: 'Open Sans', sans-serif;  /* écriture non latine : voir la liste en haut de la page, ex. 'LXGW WenKai Mono TC', 'Open Sans', sans-serif */
  --title-native-size: 16px;
  --title-native-weight: 600;        /* mets 400 si la police choisie est « 400 seulement » */
  --title-native-style: italic;      /* italic ou normal */
  --title-native-color: #2a5da0;
  --title-native-letter-spacing: 2px; /* mets 0px pour arabe, hindi... (écriture reliée) */

  /* ---------- DRAPEAU (au-dessus du titre) ---------- */
  --flag-width: 200px;        /* largeur du drapeau (la hauteur s'adapte) */
  --flag-gap: 30px;          /* espace entre le drapeau et le titre */
}
/* Nom natif de la langue (tous les réglages sont dans :root, en haut) */
.lang-title-native {
  font-family: var(--title-native-font);
  font-size: var(--title-native-size);
  font-weight: var(--title-native-weight);
  font-style: var(--title-native-style);
  color: var(--title-native-color);
  letter-spacing: var(--title-native-letter-spacing);
  line-height: 1.4;
  margin-top: 4px;
}

/* Drapeau du pays au-dessus du titre (réglages dans :root : --flag-width, --flag-gap) */
.lang-flag {
  display: block;
  width: var(--flag-width);
  height: auto;
  margin: 0 auto var(--flag-gap);
  filter: drop-shadow(0 1px 3px rgba(0,0,0,0.25));   /* ombre qui suit la forme de l'image (enlève la ligne si tu n'en veux pas) */
}

/* Défilement en douceur (pas de saut brutal) pour les liens d'ancrage,
   notamment le sommaire de catégories juste en dessous */
html {
  scroll-behavior: smooth;
}


body, .film-title, .category-title, #filmSearch {
  font-family: 'Open Sans', sans-serif !important;
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

.film-list-wrapper {
  overflow-x: hidden;
  padding: 10px var(--page-margin);
  padding-bottom: 40px;
  box-sizing: border-box;
}

#filmSearch {
  width: 300px;
  padding: 8px 12px;
  font-size: 12px;
  border-radius: 10px;
  border: 1px solid #ccc;
  margin: 20px auto;
  display: block;
  box-sizing: border-box;
  transition: all 0.3s ease;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}
#filmSearch:focus {
  outline: none;
  border-color: #7da1c9;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}

/* ============================================================
   MESSAGE "AUCUN RÉSULTAT"
   Caché par défaut, affiché uniquement si une recherche ne donne
   aucun film (dans aucune catégorie).
   ============================================================ */
#noResultsMsg {
  display: none;
  text-align: center;
  font-size: 13px;
  color: #999;
  margin: 10px 0 30px;
}
#noResultsMsg strong {
  color: #666;
  font-weight: 600;
}

/* ============================================================
   SOMMAIRE DE CATÉGORIES (liens d'ancrage en haut de page)
   Volontairement discret : petits liens simples, pas un encadré.
   ============================================================ */
.category-nav {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 18px;
  margin: 4px 0 10px;
  font-size: 12px;
}
.category-nav a {
  color: #2a5da0;
  text-decoration: none;
}

.category-title {
  font-size: 20px !important;
  letter-spacing: 1px;
  margin-top: 35px;
  margin-bottom: 15px;
  padding: 0 calc(var(--page-margin) + 10px);
  font-weight: 600 !important;
  display: flex;
  align-items: center;
  box-sizing: border-box;
  scroll-margin-top: 20px;   /* petit espace au-dessus quand on arrive via le sommaire */
}

.film-list {
  list-style: none;
  padding-left: 0;
  margin-top: 10px;
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 12px;
  margin-bottom: 10px;
}
/* Le <li> devient "invisible" structurellement : c'est directement
   la carte (.film-title) à l'intérieur qui sert d'élément de grille,
   maintenant que c'est parfois un vrai <a> et pas juste un <li>. */
.film-list > li {
  display: contents;
}

/* La carte peut maintenant être soit un <div> (pas de fiche) soit un
   vrai <a href="..."> (fiche disponible) : on neutralise le style de
   lien natif du navigateur (soulignement, couleur bleue par défaut)
   pour garder l'apparence identique dans les deux cas. */
/* La CARTE = image entière (ratio 379×220, avec une petite marge blanche)
   + zone de titre en dessous. Au survol (cartes avec lien), l'image
   s'étend sur toute la carte (voir plus bas) et le titre passe par-dessus. */
.film-title {
  --card-pad: 6px;                 /* marge blanche autour de l'image au repos (0px = aucune) */
  --caption-h: 62px;               /* hauteur de la zone titre sous l'image */
  --caption-pad-x: 12px;           /* marge gauche/droite du texte (année + titre) */
  container-type: inline-size;     /* permet de calculer la hauteur de l'image depuis la largeur de la carte (unité cqw) */
  display: block;
  position: relative;
  width: 100%;
  border-radius: 8px;
  overflow: hidden;
  background: #fff;
  transition: transform 0.25s ease, box-shadow 0.25s ease;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  text-decoration: none;
  color: inherit;
}
/* Donne sa hauteur à la carte : image entière (ratio fixe) + zone titre
   (l'image et le titre sont en position absolue, ce bloc réserve la place). */
.film-title::after {
  content: "";
  display: block;
  height: calc(var(--card-pad) + (100cqw - 2 * var(--card-pad)) / (379 / 220) + var(--caption-h));
}

/* Au survol d'une carte AVEC lien : juste une ombre un peu plus
   marquée, pour un effet de "soulèvement" léger — sans agrandir la
   carte (un "transform: scale()" ici la ferait déborder de sa case
   dans la grille et chevaucher la carte voisine, comme observé). */
.film-title.has-link:hover {
  transform: scale(1.04);
  box-shadow: 0 10px 15px rgba(0,0,0,0.25);
  cursor: pointer;
  z-index: 5;
}

/* IMAGE : au repos, elle est entière (ratio d'origine) avec la petite
   marge blanche ; au survol, elle s'étend sur TOUTE la carte (les côtés
   sont alors un peu coupés). Vitesse de l'animation : les 0.45s ci-dessous. */
.film-title img {
  position: absolute;
  top: var(--card-pad);
  left: var(--card-pad);
  width: calc(100% - 2 * var(--card-pad));
  height: calc((100cqw - 2 * var(--card-pad)) / (379 / 220));
  border-radius: 6px;
  object-fit: cover;
  object-position: center top;
  z-index: 0;
  display: block;
  transition: filter 0.3s ease, opacity 0.3s ease, top 0.45s ease, left 0.45s ease, width 0.45s ease, height 0.45s ease, border-radius 0.45s ease;
}
.film-title.has-link:hover img {
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  border-radius: 0;
}

/* Repère visuel rapide : une carte SANS fiche a sa photo légèrement
   désaturée/assombrie (même principe que les cartes "No Dub" plus bas
   dans la page). Comme ça, d'un coup d'œil sur la grille, les photos
   en couleurs pleines = cliquables, les photos plus ternes = pas de
   fiche disponible. On exclut les cartes ".no-dub" ici : elles ont
   déjà leur propre traitement (plus prononcé), pas la peine de cumuler
   les deux. */
.film-title:not(.has-link):not(.no-dub) img {
  filter: grayscale(30%) brightness(0.97);
  opacity: 0.95;
}

/* La BARRE DE TITRE : contient le millésime + le titre, posés en bas
   de la photo. Elle-même ne bouge JAMAIS — c'est uniquement son FOND
   blanc (.caption-bg, juste en dessous) qui glisse vers le bas comme
   un rideau. Le texte, lui, reste toujours à la même place, et passe
   simplement en blanc au survol pour rester lisible par-dessus la
   photo (voir plus bas, ".has-link:hover .film-year/.film-name"). */
.film-title .card-caption {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 2;
  height: var(--caption-h);   /* même hauteur de zone titre pour toutes les cartes (titre sur 1 ou 2 lignes) */
  box-sizing: border-box;
  padding: 4px var(--caption-pad-x) 5px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  text-align: center;
}

/* Le FOND blanc de la barre : un calque séparé, juste derrière le
   texte (z-index inférieur à celui du texte, supérieur à celui de la
   photo). C'est lui qui glisse et disparaît sous la carte au survol —
   "comme un rideau qui descend" — un simple "transform: translateY()"
   anime ça sans reflow ni recalcul de mise en page. */
.film-title .caption-bg {
  position: absolute;
  inset: 0;
  z-index: -1;
  background: #fff;
  box-shadow: 0 -1px 5px rgba(0,0,0,0.08);
  transition: transform 0.45s ease;
}
.film-title.has-link:hover .caption-bg {
  transform: translateY(100%);
}

/* Effet "balayage lumineux" au survol des cartes avec lien : un fin
   reflet diagonal qui traverse la carte une fois. */
.film-title.has-link::before {
  content: "";
  position: absolute;
  top: -40%;
  left: -110%;
  width: 90%;               /* bande large : plus la valeur est grande, plus le reflet est diffus */
  height: 180%;
  /* Dégradé à plusieurs paliers (pas de bord net) + flou + mode de fusion :
     la lumière « éclaire » l'image au lieu de poser un rectangle clair dessus.
     Les 3 réglages : l'intensité (0.5 ci-dessous), le flou (blur) et l'angle (rotate). */
  background: linear-gradient(
    90deg,
    rgba(255,255,255,0) 0%,
    rgba(255,255,255,0.04) 18%,
    rgba(255,255,255,0.16) 36%,
    rgba(255,255,255,0.5) 50%,
    rgba(255,255,255,0.16) 64%,
    rgba(255,255,255,0.04) 82%,
    rgba(255,255,255,0) 100%
  );
  filter: blur(20px);
  mix-blend-mode: soft-light;  /* éclaircit selon l'image (visible sur les affiches sombres aussi). Essaie "overlay" pour plus d'intensité */
  transform: rotate(14deg);
  pointer-events: none;
  opacity: 0;
  z-index: 1;   /* au-dessus de l'image, sous la barre de titre */
}

.film-title.has-link:hover::before {
  opacity: 1;
  animation: projectorSweepOnce 0.7s ease-out forwards;
}

@keyframes projectorSweepOnce {
  0%   { left: -110%; }
  100% { left: 110%; }
}

.film-title .film-year {
  position: relative;
  z-index: 1;   /* au-dessus du fond blanc (-1) de la barre */
  display: block;
  font-weight: 800;
  font-size: 11px;
  margin-bottom: 2px;
  color: #666;
  letter-spacing: 1px;
  transition: color 0.3s ease, text-shadow 0.3s ease;
}
/* Quand la carte a un lien, la date passe aussi dans le bleu du site
   (comme le titre) pour que le repère "cliquable" soit plus visible,
   même sur un visuel où le bleu du titre ressort moins (ex: Pinocchio). */
.film-title.has-link .film-year {
  color: #2a5da0;
}
/* Titre du film : en italique par défaut (= pas de fiche disponible),
   devient normal et prend le bleu du site dès que la carte a un lien
   (voir juste après, ".has-link"). Pas de limite à 2 lignes ici : la
   barre n'est plus contrainte à une hauteur fixe, elle grandit toute
   seule si le titre est long — rien n'est jamais coupé. */
.film-title .film-name {
  position: relative;
  z-index: 1;
  display: block;
  font-size: 12px;
  margin: 0;
  color: #000;
  font-style: italic;
  transition: color 0.3s ease, text-shadow 0.3s ease;
}
.film-title.has-link .film-name {
  color: #2a5da0;
  font-style: normal;
}

/* Une fois le fond blanc parti au survol, le texte se retrouve
   directement sur la photo : il passe en blanc avec une ombre portée
   pour rester lisible. */
.film-title.has-link:hover .film-year,
.film-title.has-link:hover .film-name {
  color: #fff;
  text-shadow: 0 1px 6px rgba(0,0,0,0.85);
}

.category-title img {
  width: 34px;
  height: 34px;
  margin-right: 8px;
  vertical-align: middle;
}

.keywords {
  display: none;
}

.no-dub {
  filter: grayscale(100%) brightness(0.92);
  opacity: 0.9;
  transition: filter 0.3s ease, opacity 0.3s ease;
}

.no-dub:hover {
  filter: grayscale(80%) brightness(1);
  opacity: 1;
}

.no-dub img {
  filter: grayscale(100%);
  opacity: 0.9;
  transition: opacity 0.3s ease;
}

.no-dub:hover img {
  opacity: 1;
}

/* Badges en haut à droite de la carte, empilés (le 1er en haut, le suivant dessous) :
   - "No Dub" (automatique avec noDub:true)
   - le badge personnalisé (champ badge:"…"), ajouté en plus.
   S'il n'y a qu'un seul badge, il se place tout en haut. */
.card-badges {
  position: absolute;
  top: 10px;
  right: 10px;
  z-index: 3;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 4px;
  pointer-events: none;
}
.no-dub-badge {
  background: rgba(0,0,0,0.6);
  color: #fff;
  font-size: 10px;
  padding: 2px 6px;
  border-radius: 5px;
}

.no-dub-title img {
  width: 38px;
  height: 38px;
  opacity: 0.85;
}

/* Studio filter buttons */
.studio-filter {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  margin: 30px var(--page-margin) 30px;
}

.studio-btn {
  font-family: 'Open Sans', sans-serif;
  font-size: 12px;
  padding: 6px 18px;
  border-radius: 20px;
  border: 1px solid #ccc;
  background: #f5f5f5;
  color: #333;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: background 0.35s ease, color 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease;
}

.studio-btn:not(.active):hover {
  background: #e0e0e0;
}

.studio-btn.active {
  background: #2a5da0;
  border-color: #2a5da0;
  color: #fff;
  box-shadow: 0 3px 8px rgba(26, 74, 138, 0.35);
}

.studio-btn .count {
  font-size: 10px;
  opacity: 0.75;
  margin-left: 2px;
}

/* ============================================================
   SECTION TRIVIA (bas de page)
   ============================================================ */
.trivia-section {
  margin: 50px 0 200px;
  padding: 0 calc(var(--page-margin) + 100px);
  box-sizing: border-box;
  color: #333;
}
.trivia-title {
  font-size: 20px;
  font-weight: 600;
  color: #222;
  letter-spacing: 1px;
  margin-bottom: 12px;
  text-align: center;
}
.trivia-title .highlight {
  color: #d9534f;
}
.trivia-section ul {
  padding-left: 20px;
  margin: 0;
}
.trivia-section li {
  margin-bottom: 6px;
  font-size: 14px;
  line-height: 1.5;
}

/* ============================================================
   BOUTON "RETOUR EN HAUT"
   Même design que sur les fiches personnage, pour rester cohérent
   sur tout le site (apparaît après un peu de scroll).
   ============================================================ */
#backToTop {
  position: fixed;
  right: 24px;
  bottom: 24px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: #fff;
  border: 2px solid #2a5da0;
  box-shadow: 0 4px 14px rgba(0,0,0,0.2);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  opacity: 0;
  pointer-events: none;
  transform: translateY(10px);
  transition: opacity 0.3s ease, transform 0.3s ease;
  z-index: 50;
}
#backToTop.visible {
  opacity: 1;
  pointer-events: auto;
  transform: translateY(0);
}
#backToTop svg {
  width: 30px;
  height: 30px;
}


@media (max-width: 1400px) {
  .film-list { grid-template-columns: repeat(4, 1fr); }
}
@media (max-width: 900px) {
  .film-list { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 500px) {
  .film-list { grid-template-columns: 1fr; }
}
</style>
