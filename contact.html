<!-- GOOGLE FONT -->
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300..800&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">

<style>
:root {
  --page-margin: 10%;
}

body {
  font-family: 'Open Sans', sans-serif !important;
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* ============================================================
   TITRE DE PAGE — le même bloc réutilisé tel quel que sur les
   autres pages (Character Voices, etc.), pour rester cohérent.
   MODIFIE ICI les 6 variables : c'est tout ce que tu as à changer.
   ============================================================ */
:root {
  --page-title-font: 'IM Fell English', serif;  /* police d'écriture */
  --page-title-size: 30px;                       /* taille du texte */
  --page-title-weight: 500;                      /* graisse : 100 (très fin) à 900 (très gras) */
  --page-title-spacing: 2px;                     /* espacement entre les lettres */
  --page-title-align: center;                    /* alignement : left / center / right */
  --page-title-color: #222;                      /* couleur du texte */
}

.page-title {
  font-family: var(--page-title-font);
  font-size: var(--page-title-size);
  font-weight: var(--page-title-weight);
  letter-spacing: var(--page-title-spacing);
  text-align: var(--page-title-align);
  color: var(--page-title-color);
  padding-top: 60px;   /* espace au-dessus, laissé à part : propre à chaque page si besoin */
}

/* Première lettre du titre en bleu du site (même bleu que le reste,
   #2a5da0), légèrement plus grande que le reste du titre — réutilisé
   tel quel sur les autres pages (Character Voices, etc.) pour rester
   cohérent. */
.page-title .title-accent {
  color: #2a5da0;
}
.page-title .title-rest {
  font-size: 0.85em; /* légèrement plus petit que la première lettre */
}

.page-subtitle {
  text-align: center;
  font-size: 14px;
  color: #888;
  margin: 10px 0 0;
}

/* ============================================================
   FORMULAIRE DE CONTACT
   MODIFIE ICI : largeur, espacement, couleurs des champs
   ============================================================ */
:root {
  --accent: #2a5da0;             /* même bleu que le reste du site */
  --form-max-width: 520px;       /* largeur maximale du formulaire */
  --field-radius: 10px;          /* arrondi des champs (même que les barres de recherche) */
}

.contact-form {
  position: relative;
  z-index: 1; /* passe au-dessus de Mickey (voir .mickey-deco plus bas) */
  max-width: var(--form-max-width);
  margin: 40px auto 80px;
  padding: 0 20px;
  box-sizing: border-box;
}

/* Conteneur autour du titre + formulaire, assez large pour laisser de
   la place à Mickey sur le côté (le formulaire, lui, reste centré à
   sa largeur habituelle grâce à --form-max-width ci-dessus). */
.contact-wrap {
  position: relative;
  max-width: 900px;
  margin: 0 auto;
}

/* Mickey, positionné pour que sa main levée arrive juste sous le
   champ "Your name" (calé sur l'image réelle, 534×599 — il y a un
   peu de vide au-dessus de la main dans l'image elle-même, pris en
   compte dans le "top" ci-dessous). Ajuste de quelques pixels une
   fois la page publiée si besoin. */
.mickey-deco {
  position: absolute;
  left: -30px;
  top: 190px;
  width: 280px;
  height: auto;
  pointer-events: none;
  z-index: 0;
}

/* Pas assez de place à côté du formulaire sur petit/moyen écran :
   on cache Mickey plutôt que de le faire chevaucher les champs. */
@media (max-width: 900px) {
  .mickey-deco {
    display: none;
  }
}

.form-field {
  margin-bottom: 18px;
}

/* Deux champs sur la même ligne (nom + email) */
.form-row {
  display: flex;
  gap: 16px;
}
.form-row .form-field {
  flex: 1;
  min-width: 0; /* évite que les champs débordent sur mobile */
}

@media (max-width: 560px) {
  .form-row {
    flex-direction: column;
    gap: 0;
  }
}

.form-field label {
  display: block;
  font-size: 11px;
  color: #999;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 6px;
}

/* Petit astérisque rouge pour les champs obligatoires */
.required-star {
  color: #c0392b;
  font-size: 12px;
  margin-left: 2px;
}

/* Le champ Message déborde un peu de la largeur des autres champs,
   pour se distinguer visuellement — voir --message-extra ci-dessous. */
:root {
  --message-extra: 45px; /* débordement de chaque côté */
}
.form-field-message {
  margin-left: calc(var(--message-extra) * -1);
  margin-right: calc(var(--message-extra) * -1);
}
.form-field-message textarea {
  min-height: 160px;
}

@media (max-width: 700px) {
  /* Sur petit écran, pas la place de déborder : on revient à la largeur normale */
  .form-field-message {
    margin-left: 0;
    margin-right: 0;
  }
}

.form-hint {
  margin: 6px 0 0;
  font-size: 11px;
  color: #999;
  line-height: 1.5;
  text-align: center;
}
.form-hint a {
  color: #2a5da0;
  font-weight: 600;
}

.form-field input,
.form-field textarea {
  width: 100%;
  padding: 10px 14px;
  font-size: 14px;
  font-family: 'Open Sans', sans-serif;
  border-radius: var(--field-radius);
  border: 1px solid #ccc;
  box-sizing: border-box;
  transition: all 0.3s ease;
  resize: vertical;
  /* Légèrement transparent : on lit bien ce qu'on écrit, mais on
     devine Mickey derrière quand la box passe devant lui. */
  background: rgba(255, 255, 255, 0.75);
}
.form-field input:focus,
.form-field textarea:focus {
  outline: none;
  border-color: #7da1c9;
  box-shadow: 0 4px 10px rgba(0,0,0,0.15);
}

.form-field textarea {
  min-height: 140px;
}

/* Champ "piège à robots" : invisible pour un humain, mais un bot qui
   remplit tous les champs automatiquement le remplira aussi — ce qui
   permet de rejeter silencieusement le message (voir le script). */
.form-honeypot {
  position: absolute;
  left: -9999px;
  width: 1px;
  height: 1px;
  overflow: hidden;
}

.submit-btn {
  position: relative;
  display: block;
  width: fit-content;
  margin: 0 auto;
  padding: 12px 32px;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.5px;
  color: #fff;
  background: var(--accent);
  border: none;
  border-radius: var(--field-radius);
  cursor: pointer;
  overflow: hidden; /* garde le reflet lumineux dans les bords arrondis */
  transition: opacity 0.2s ease, transform 0.15s ease;
}
.submit-btn:hover {
  opacity: 0.9;
}
.submit-btn:active {
  transform: scale(0.98);
}
.submit-btn:disabled {
  opacity: 0.6;
  cursor: default;
}

/* Reflet lumineux qui glisse une fois sur le bouton au survol —
   même esprit que le balayage des cartes de film, mais adapté aux
   proportions fines et larges d'un bouton (sinon le reflet ne
   traverse qu'en triangle dans un coin). */
.submit-btn::before {
  content: "";
  position: absolute;
  top: 0;
  left: -75%;
  width: 40%;
  height: 100%;
  background: linear-gradient(
    120deg,
    rgba(255,255,255,0) 0%,
    rgba(255,255,255,0.55) 50%,
    rgba(255,255,255,0) 100%
  );
  transform: skewX(-20deg);
  pointer-events: none;
}
.submit-btn:hover::before {
  animation: buttonShineOnce 0.9s ease forwards;
}
@keyframes buttonShineOnce {
  0%   { left: -75%; }
  100% { left: 130%; }
}

/* Les lettres du bouton font un petit tour sur elles-mêmes et
   passent en italique au survol (décalage progressif lettre par
   lettre, réglé en JS via transition-delay). */
.submit-btn .btn-text {
  position: relative;
  z-index: 1; /* reste au-dessus du reflet lumineux */
}
.submit-btn .letter {
  display: inline-block;
  transition: transform 0.35s ease, font-style 0s;
}
.submit-btn:hover .letter {
  transform: rotateY(360deg);
  font-style: italic;
}
.submit-btn:disabled .letter {
  transform: none;
  font-style: normal;
}

/* Message affiché après l'envoi (succès ou erreur), juste sous le bouton */
.form-status {
  margin-top: 14px;
  font-size: 13px;
  text-align: center;
  display: none;   /* affiché en JS uniquement quand il y a quelque chose à dire */
}
.form-status.success {
  display: block;
  color: #2a7a4a;
}
.form-status.error {
  display: block;
  color: #c0392b;
}
</style>

<div class="contact-wrap">

<div class="page-title"><span class="title-accent">C</span><span class="title-rest">ONTACT</span></div>
<div class="page-subtitle">Something to correct, a source to share, a question? Reach out here.</div>

<!-- MICKEY DÉCO — hébergé sur Cloudinary -->
<img src="https://res.cloudinary.com/dofvjifeo/image/upload/MickeyContact.svg" alt="" class="mickey-deco">

<form id="contactForm" class="contact-form">
  <div class="form-row">
    <div class="form-field">
      <label for="fieldName">Your name <span class="required-star">*</span></label>
      <input type="text" id="fieldName" name="from_name" required>
    </div>

    <div class="form-field">
      <label for="fieldEmail">Your email <span class="required-star">*</span></label>
      <input type="email" id="fieldEmail" name="reply_to" required>
    </div>
  </div>

  <div class="form-field">
    <label for="fieldSubject">Subject <span class="required-star">*</span></label>
    <input type="text" id="fieldSubject" name="subject" required>
  </div>

  <div class="form-field form-field-message">
    <label for="fieldMessage">Message <span class="required-star">*</span></label>
    <textarea id="fieldMessage" name="message" required></textarea>
    <p class="form-hint">Have files to share (e.g. credits screenshots)? Upload them on
      <a href="https://www.swisstransfer.com" target="_blank" rel="noopener">SwissTransfer</a>
      using "Create a link" (not "Send by email"), then paste the link above.</p>
  </div>

  <!-- Piège à robots : ce champ doit rester VIDE. Un vrai visiteur ne le
       voit jamais (voir .form-honeypot ci-dessus) et ne le remplit donc
       jamais ; un robot qui remplit tous les champs le remplira, ce qui
       permet au script de rejeter le message sans même l'envoyer. -->
  <div class="form-field form-honeypot" aria-hidden="true">
    <label for="fieldWebsite">Website</label>
    <input type="text" id="fieldWebsite" name="website" tabindex="-1" autocomplete="off">
  </div>

  <button type="submit" class="submit-btn" id="submitBtn"><span class="btn-text" id="btnText">Send message</span></button>
  <div class="form-status" id="formStatus"></div>
</form>

</div><!-- /.contact-wrap -->

<!-- ============================================================
     EMAILJS
     Le SDK qui envoie réellement l'email (voir le script plus bas).
     ============================================================ -->
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<script>
// ============================================================
//  MODIFIE ICI : les 3 identifiants venant de ton compte EmailJS
//  (Public Key, Service ID, Template ID). Voir le guide de mise en
//  place fourni à côté de ce fichier pour savoir où les trouver.
// ============================================================
const EMAILJS_PUBLIC_KEY = "PjxMnXm22TCdYQhmQ";
const EMAILJS_SERVICE_ID  = "service_wnpalvi";
const EMAILJS_TEMPLATE_ID = "template_46ya0c1";

emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY });

const form = document.getElementById('contactForm');
const submitBtn = document.getElementById('submitBtn');
const btnText = document.getElementById('btnText');
const status = document.getElementById('formStatus');

// Découpe un texte en lettres, chacune dans son propre <span>, avec un
// petit décalage progressif (transition-delay) pour l'effet de survol
// "les lettres font un tour sur elles-mêmes" défini en CSS (.letter).
function wrapLetters(el, text) {
  el.innerHTML = '';
  Array.from(text).forEach(function (ch, i) {
    const span = document.createElement('span');
    span.className = 'letter';
    span.textContent = ch === ' ' ? ' ' : ch;
    span.style.transitionDelay = (i * 0.02) + 's';
    el.appendChild(span);
  });
}

wrapLetters(btnText, 'Send message');

form.addEventListener('submit', function (e) {
  e.preventDefault();

  // Piège à robots : si ce champ caché a été rempli, on fait semblant
  // que tout s'est bien passé (pour ne pas donner d'indice à un bot
  // sur le fait qu'il a été détecté), mais on n'envoie rien du tout.
  if (form.website.value !== '') {
    showStatus('success', "Message sent — thank you!");
    form.reset();
    return;
  }

  submitBtn.disabled = true;
  btnText.textContent = 'Sending...';

  emailjs.sendForm(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, form)
    .then(() => {
      showStatus('success', "Message sent — thank you! I'll get back to you soon.");
      form.reset();
    })
    .catch((err) => {
      console.error('EmailJS error:', err);
      showStatus('error', "Something went wrong — please try again, or reach out another way.");
    })
    .finally(() => {
      submitBtn.disabled = false;
      wrapLetters(btnText, 'Send message');
    });
});

function showStatus(kind, text) {
  status.className = 'form-status ' + kind;
  status.textContent = text;
}
</script>
